<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 1150" width="830" height="1150" font-family="'Noto Sans KR','Noto Sans KR Ext','Noto Sans CJK KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <title>블러드 녹턴 3D 판 — 세계 지도 밑그림</title>
  <desc>에슈빌을 가운데 둔 발라키르 골짜기. 지역, 이어진 길, 던전 번호(가는 순서), 종소리가 닿는 동그라미.</desc>

  <rect x="0" y="0" width="830" height="1150" fill="#f5efe2"/>

  <!-- 제목 -->
  <text x="415" y="46" text-anchor="middle" font-size="31" font-weight="800" fill="#2a1a1a">블러드 녹턴 3D 판 · 세계 지도 밑그림</text>
  <text x="415" y="76" text-anchor="middle" font-size="20" fill="#5a4a44">에슈빌을 가운데 둔 발라키르 골짜기</text>
  <g transform="translate(770,58)">
    <path d="M0,22 L0,-14 M-9,-3 L0,-16 L9,-3" fill="none" stroke="#2a1a1a" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="0" y="46" text-anchor="middle" font-size="19" font-weight="700" fill="#2a1a1a">북</text>
  </g>

  <!-- 종소리가 닿는 동그라미 -->
  <g fill="none" stroke="#b8862e" stroke-width="3" stroke-dasharray="4 10" stroke-linecap="round">
    <circle cx="400" cy="560" r="168"/>
    <circle cx="400" cy="560" r="300" opacity="0.75"/>
    <circle cx="400" cy="560" r="432" opacity="0.5"/>
  </g>

  <!-- 길 -->
  <g stroke="#5b4636" stroke-width="7" stroke-linecap="round" fill="none">
    <line x1="400" y1="500" x2="400" y2="419"/>
    <line x1="400" y1="335" x2="400" y2="299"/>
    <line x1="400" y1="215" x2="400" y2="179"/>
    <line x1="255" y1="377" x2="280" y2="377"/>
    <line x1="135" y1="419" x2="135" y2="515"/>
    <line x1="255" y1="560" x2="270" y2="560"/>
    <line x1="530" y1="560" x2="545" y2="560"/>
    <line x1="665" y1="515" x2="665" y2="449"/>
    <line x1="440" y1="620" x2="530" y2="715"/>
    <line x1="440" y1="757" x2="300" y2="757"/>
  </g>
  <!-- 땅속 물길 -->
  <path d="M690,757 H806 V257 H785" fill="none" stroke="#2f6f9a" stroke-width="6" stroke-dasharray="14 9" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="794" y="682" text-anchor="end" font-size="21" font-weight="800" fill="#2f6f9a" stroke="#f5efe2" stroke-width="6" paint-order="stroke">땅속 물길</text>

  <!-- 지역 상자 -->
  <g stroke="#3a2a22" stroke-width="2.5">
    <rect x="220" y="95" width="360" height="84" rx="16" fill="#dcebf3"/>
    <rect x="280" y="215" width="240" height="84" rx="16" fill="#e3d6e6"/>
    <rect x="280" y="335" width="240" height="84" rx="16" fill="#e3d6e6"/>
    <rect x="15" y="335" width="240" height="84" rx="16" fill="#d9e6d2"/>
    <rect x="545" y="215" width="240" height="84" rx="16" fill="#d4e3ee" stroke="#2f6f9a" stroke-dasharray="9 6"/>
    <rect x="545" y="365" width="240" height="84" rx="16" fill="#f3dcdc"/>
    <rect x="545" y="515" width="240" height="90" rx="16" fill="#e4e2dc"/>
    <rect x="15" y="515" width="240" height="90" rx="16" fill="#f1dfc9"/>
    <rect x="60" y="715" width="240" height="84" rx="16" fill="#dcdcea"/>
    <rect x="440" y="715" width="250" height="84" rx="16" fill="#d4e3ee"/>
  </g>
  <!-- 에슈빌 (가운데) -->
  <rect x="270" y="500" width="260" height="120" rx="20" fill="#8c2f2a" stroke="#3a1512" stroke-width="4"/>

  <!-- 지역 이름 -->
  <g text-anchor="middle" fill="#2a1a1a">
    <text x="400" y="131" font-size="27" font-weight="800">발라키르 빙하</text>
    <text x="400" y="162" font-size="22">얼어붙은 첨탑 · 하늘의 닻</text>

    <text x="400" y="250" font-size="27" font-weight="800">악마성 본채</text>
    <text x="400" y="281" font-size="20">시계탑·왕좌·거꾸로 선 성</text>

    <text x="400" y="370" font-size="25" font-weight="800">악마성 정문·대회랑</text>
    <text x="400" y="401" font-size="22">관문 · 문지기 둘라한</text>

    <text x="140" y="370" font-size="27" font-weight="800">늑대 고개</text>
    <text x="140" y="401" font-size="22">은 광산 · 숲의 닻</text>

    <text x="670" y="250" font-size="24" font-weight="800">성 아래 검은 물길</text>
    <text x="670" y="281" font-size="21">연구소·요람의 탑 (땅속)</text>

    <text x="670" y="400" font-size="27" font-weight="800">장미 수녀원</text>
    <text x="670" y="431" font-size="22">거울의 닻</text>

    <text x="670" y="553" font-size="27" font-weight="800">안개의 묘지</text>
    <text x="670" y="585" font-size="22">배웅의 납골당</text>

    <text x="140" y="553" font-size="24" font-weight="800">불탄 목장 · 요새 터</text>
    <text x="140" y="585" font-size="20">지하 대장간 · 용광로의 닻</text>

    <text x="185" y="750" font-size="27" font-weight="800">이름 없는 언덕</text>
    <text x="185" y="781" font-size="22">까마귀 둥지 · 꿈의 닻</text>

    <text x="570" y="750" font-size="24" font-weight="800">방앗간 내 · 잠긴 수문</text>
    <text x="570" y="781" font-size="22">작은 던전 (안 해도 됨)</text>
  </g>
  <g text-anchor="middle" fill="#fff6e6">
    <text x="400" y="548" font-size="36" font-weight="800">에슈빌</text>
    <text x="400" y="579" font-size="22">성당 종탑 · 흑묘 여관</text>
    <text x="400" y="606" font-size="21" font-weight="700" fill="#ffd98a">금 간 종 = 일곱 번째 닻</text>
  </g>

  <!-- 던전 번호 (가는 순서) -->
  <g font-size="26" font-weight="800" text-anchor="middle" fill="#ffffff">
    <g><circle cx="545" cy="515" r="23" fill="#7a1f1f" stroke="#fff" stroke-width="3"/><text x="545" y="524">1</text></g>
    <g><circle cx="545" cy="365" r="23" fill="#7a1f1f" stroke="#fff" stroke-width="3"/><text x="545" y="374">2</text></g>
    <g><circle cx="30" cy="515" r="23" fill="#7a1f1f" stroke="#fff" stroke-width="3"/><text x="30" y="524">3</text></g>
    <g><circle cx="30" cy="335" r="23" fill="#7a1f1f" stroke="#fff" stroke-width="3"/><text x="30" y="344">4</text></g>
    <g><circle cx="60" cy="715" r="23" fill="#7a1f1f" stroke="#fff" stroke-width="3"/><text x="60" y="724">5</text></g>
    <g><circle cx="785" cy="215" r="23" fill="#7a1f1f" stroke="#fff" stroke-width="3"/><text x="785" y="224">6</text></g>
    <g><circle cx="220" cy="95" r="23" fill="#7a1f1f" stroke="#fff" stroke-width="3"/><text x="220" y="104">7</text></g>
    <g><circle cx="280" cy="215" r="23" fill="#7a1f1f" stroke="#fff" stroke-width="3"/><text x="280" y="224">8</text></g>
    <g><circle cx="520" cy="215" r="23" fill="#7a1f1f" stroke="#fff" stroke-width="3"/><text x="520" y="224">9</text></g>
  </g>
  <!-- 작은 던전 표시 -->
  <g>
    <rect x="-17" y="-17" width="34" height="34" transform="translate(440,715) rotate(45)" fill="#2f6f9a" stroke="#fff" stroke-width="3"/>
  </g>

  <!-- 범례 -->
  <rect x="15" y="850" width="800" height="285" rx="16" fill="#fffaf0" stroke="#3a2a22" stroke-width="2"/>
  <g fill="#2a1a1a" font-size="21">
    <circle cx="50" cy="886" r="19" fill="#7a1f1f"/>
    <text x="50" y="894" text-anchor="middle" font-size="22" font-weight="800" fill="#fff">1</text>
    <text x="82" y="893"><tspan font-weight="800">던전</tspan> — 번호는 가는 순서 (8·9는 성 안)</text>

    <rect x="-13" y="-13" width="26" height="26" transform="translate(50,932) rotate(45)" fill="#2f6f9a"/>
    <text x="82" y="939"><tspan font-weight="800">작은 던전</tspan> — 곁이야기</text>

    <circle cx="50" cy="978" r="17" fill="none" stroke="#b8862e" stroke-width="3" stroke-dasharray="4 7" stroke-linecap="round"/>
    <text x="82" y="985"><tspan font-weight="800">종소리가 닿는 곳</tspan> — 던전 하나에 한 겹. 바깥은 「고요」</text>

    <line x1="32" y1="1024" x2="68" y2="1024" stroke="#2f6f9a" stroke-width="6" stroke-dasharray="12 7" stroke-linecap="round"/>
    <text x="82" y="1031"><tspan font-weight="800">땅속 물길</tspan> — 수문의 물을 빼야 들어간다</text>

    <text x="32" y="1076" font-size="20" font-weight="800">여는 순서</text>
    <text x="130" y="1076" font-size="20">묘지 → 수녀원 → 요새 터 → 늑대 고개 → 성문</text>
    <text x="130" y="1106" font-size="20">→ 이름 없는 언덕 → 검은 물길 → 빙하 → 성 안</text>
  </g>
</svg>
