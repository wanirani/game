<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>캐릭터 렌더 갤러리</title>
<style>
  html, body { margin: 0; background: #07040a; color: #d8ccb8; font-family: 'Noto Sans KR', sans-serif; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<script type="module">
// 캐릭터 렌더러 갤러리: 6인 × 동작, 공격(판정 구간 중간 프레임 + 판정 상자), 직업 외형, NPC, 무기 단계
// ?anim=1 : 실시간 애니메이션 / ?box=1 : 공격 판정 상자 표시 / ?sec=chars|seq|attacks|classes|npcs|weapons|rack / ?zoom=all|<캐릭터ID>&cls=&a=
import { drawHero, drawWeaponPreview } from '../src/render/hero.js';
import { CHARACTERS, CHAR_ORDER } from '../src/data/characters.js';
import { CLASSES, classChain } from '../src/data/classes.js';
import { MOVESETS } from '../src/data/movesets.js';

const Q = new URLSearchParams(location.search);
const LIVE = Q.has('anim');
const BOX = Q.has('box');
const SEC = (Q.get('sec') || 'chars,seq,sim,attacks,classes,equip,npcs,rack,weapons').split(',');
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const W = 1280;

function lookOf(charId, classId, w = {}) {
  const ch = CHARACTERS[charId];
  const look = structuredClone(ch.look);
  if (classId) for (const c of classChain(classId)) Object.assign(look, structuredClone(c.look || {}));
  look.weapon = { type: w.type ?? ch.weaponType, style: w.style ?? 1, level: w.level ?? 0, rarity: w.rarity ?? 0, element: w.element ?? null, color: w.color };
  return look;
}
function ent(o) {
  return Object.assign({ facing: 1, anim: 'idle', animT: 0.5, move: null, moveT: 0, vx: 0, vy: 0, onGround: true, rig: {}, t: 3, stats: { reach: 0 }, charging: 0, muzzleT: 0 }, o);
}
// 셀 목록 → 레이아웃
const cells = [];
let Y = 10;
function header(text) { cells.push({ kind: 'h', text, y: Y }); Y += 34; }
function row(items, cw, ch, sc) {
  let x = 10;
  items.forEach((it, i) => { if (x + cw > W) { x = 10; Y += ch; } cells.push({ kind: 'c', x, y: Y, w: cw, h: ch, sc, ...it }); x += cw; });
  Y += ch + 6;
}
const NON_ATK = [
  ['idle', {}], ['run', { anim: 'run', vx: 280 }], ['jump', { anim: 'jump', vy: -600, onGround: false }], ['fall', { anim: 'fall', vy: 500, onGround: false }],
  ['crouch', { anim: 'crouch' }], ['dash', { anim: 'dash', animT: 0.06, vx: 650 }], ['cast', { anim: 'cast', animT: 0.15 }],
  ['charge', { anim: 'charge', charging: 0.7 }], ['hurt', { anim: 'hurt', animT: 0.05, vx: -200 }], ['throw', { anim: 'throw', animT: 0.12 }],
];
const ZOOM = Q.get('zoom');
if (ZOOM === 'all') {
  header('6인 확대 (3.4배)');
  row(CHAR_ORDER.map((id) => ({ label: CHARACTERS[id].name, p: () => ent({ look: lookOf(id, Q.get('cls')), ch: CHARACTERS[id], anim: Q.get('a') || 'idle', vx: Q.get('a') === 'run' ? 280 : 0 }) })), 420, 390, 3.4);
} else if (ZOOM && Q.get('move')) {
  // 공격 확대: ?zoom=bran&move=up (ground0~3 | air0~2 | up | down | crouch | dash | charge) — 예비/판정 시작/중간/끝/회수 5프레임
  const id = ZOOM, ch = CHARACTERS[id], ms = MOVESETS[ch.weaponType], key = Q.get('move');
  const m = /^ground\d$/.test(key) ? ms.ground[+key[6]] : /^air\d$/.test(key) ? ms.air[+key[3]] : ms[key];
  header(`${ch.name} · ${m.anim} 확대 (예비 → 판정 → 회수)`);
  const ts = [m.hit[0] * 0.6, m.hit[0] + 0.005, (m.hit[0] + m.hit[1]) / 2, m.hit[1] - 0.005, Math.min(m.dur - 0.01, m.hit[1] + 0.05)];
  row(ts.map((t) => ({ label: `t=${t.toFixed(3)}`, wide: true, p: () => ent({ look: lookOf(id, Q.get('cls')), ch, anim: m.anim, move: m, moveT: t, onGround: key !== 'down' && !key.startsWith('air'), muzzleT: 0.05 }) })), 620, 520, 2.4);
} else if (ZOOM) {
  const id = ZOOM, ch = CHARACTERS[id];
  const cls = Q.get('cls');
  header(`${ch.name} 확대`);
  row([['idle', {}], ['run', { anim: 'run', vx: 280 }], ['jump', { anim: 'jump', vy: -600, onGround: false }]].map(([name, o]) => ({ label: name, p: () => ent({ look: lookOf(id, cls), ch, ...o }) })), 420, 640, 6);
}
if (SEC.includes('chars') && !ZOOM) {
  header('캐릭터 × 기본 동작 (2배)');
  for (const id of CHAR_ORDER) {
    row(NON_ATK.slice(0, 7).map(([name, o]) => ({ label: `${CHARACTERS[id].name.split(' ')[0]} · ${name}`, p: () => ent({ look: lookOf(id), ch: CHARACTERS[id], ...o }) })), 180, 200, 2);
  }
  header('추가 동작');
  for (const id of CHAR_ORDER) {
    row([...NON_ATK.slice(7), ['flip', { anim: 'flip', animT: 0.12, onGround: false, vy: -300 }], ['land', { anim: 'land', animT: 0.02 }], ['wall', { anim: 'wall', onGround: false, vy: 150 }], ['death', { anim: 'death', animT: 1.2 }]]
      .map(([name, o]) => ({ label: `${CHARACTERS[id].name.split(' ')[0]} · ${name}`, p: () => ent({ look: lookOf(id), ch: CHARACTERS[id], ...o }) })), 180, 170, 1.6);
  }
}
if (SEC.includes('seq') && !ZOOM) {
  header('동작 연속 프레임 (사망 · 피격 섬광 · 공중제비 · 착지)');
  const SQ = [
    ['kael', 'death', [0.08, 0.2, 0.35, 0.5, 0.66, 1.4], { vx: -150 }],
    ['bran', 'death', [0.08, 0.2, 0.35, 0.5, 0.66, 1.4], { vx: -150 }],
    ['sera', 'hurt', [0.0, 0.04, 0.08, 0.14, 0.22, 0.3], { vx: -200 }],
    ['azel', 'flip', [0.03, 0.09, 0.15, 0.21, 0.27, 0.33], { onGround: false, vy: -300 }],
    ['lia', 'dash', [0.0, 0.05, 0.1, 0.15, 0.2, 0.25], { vx: 700 }],
    ['victor', 'dash', [0.0, 0.04, 0.08, 0.12, 0.16, 0.2], { vx: 620 }],
  ];
  for (const [id, anim, ts, o] of SQ) {
    row(ts.map((at) => ({ label: `${CHARACTERS[id].name.split(' ')[0]} · ${anim} ${at.toFixed(2)}s`, p: () => ent({ look: lookOf(id), ch: CHARACTERS[id], anim, animT: at, ...o }) })), 210, 170, 1.5);
  }
}
if (SEC.includes('sim') && !ZOOM) {
  header('물리 시뮬레이션 스트립: 달리기 → 점프 → 착지 → 정지 (망토·머리카락·스카프 2차 운동)');
  for (const id of CHAR_ORDER) row([{ label: CHARACTERS[id].name, strip: id }], 1260, 200, 1.4);
}
if (SEC.includes('attacks') && !ZOOM) {
  for (const id of CHAR_ORDER) {
    const ch = CHARACTERS[id];
    const ms = MOVESETS[ch.weaponType];
    header(`${ch.name} — 공격 (판정 구간 중간 프레임, 1.3배)`);
    const list = [];
    ms.ground.forEach((m, i) => list.push([`지상 ${i + 1} ${m.anim}`, m, true]));
    ms.air.forEach((m, i) => list.push([`공중 ${i + 1} ${m.anim}`, m, false]));
    for (const k of ['up', 'down', 'crouch', 'dash', 'charge']) if (ms[k]) list.push([`${k} ${ms[k].anim}`, ms[k], k !== 'down']);
    row(list.map(([label, m, gnd]) => ({
      label, wide: true, p: () => ent({ look: lookOf(id), ch, anim: m.anim, move: m, moveT: m.box ? (m.hit[0] + m.hit[1]) / 2 : m.hit[0] + 0.015, onGround: gnd && !(m.airStall), muzzleT: 0.05 }),
    })), 312, 250, 1.3);
  }
}
if (SEC.includes('classes') && !ZOOM) {
  header('직업 외형 (상급·최상급, 2배)');
  for (const id of CHAR_ORDER) {
    const cls = Object.values(CLASSES).filter((c) => c.charId === id && c.tier >= 1);
    row(cls.map((c) => ({ label: `${c.name}`, p: () => ent({ look: lookOf(id, c.id, { style: c.tier === 2 ? 4 : 2, level: c.tier === 2 ? 10 : 7 }), ch: CHARACTERS[id] }) })), 180, 200, 2);
  }
}
if (SEC.includes('equip') && !ZOOM) {
  header('장비 외형 조합 (투구·갑옷·망토·장신구 오라, 2배)');
  const EQ = [
    ['kael', '투구+판금+왕실 망토', { headgear: 'helm', armor: 'plate', armorColor: '#a8b0bc', armorTrim: '#e8c872', cape: { color: '#8a1426', color2: '#e8c872', len: 1.2, style: 'royal' } }],
    ['kael', '두건+가죽+해진 망토', { headgear: 'hood', headColor: '#3a2418', armor: 'leather', cape: { color: '#3a2e26', color2: '#1a1214', len: 1.05, style: 'tattered' } }],
    ['sera', '티아라+성갑', { headgear: 'tiara', armor: 'holy', armorColor: '#dfe3ee', armorTrim: '#e8c872', accAura: { color: '#fff2b0', type: 'holy' } }],
    ['victor', '마법사 모자+사슬', { headgear: 'hat', headColor: '#2a2248', armor: 'chain', armorColor: '#8a8e9a' }],
    ['bran', '왕관+암흑갑+화염 오라', { headgear: 'crown', armor: 'dark', armorColor: '#3a3a40', armorTrim: '#b01830', accAura: { color: '#ff7a2a', type: 'fire' } }],
    ['lia', '뿔+가죽+얼음 오라', { headgear: 'horns', armor: 'leather', armorColor: '#3a2418', accAura: { color: '#9fd8ff', type: 'ice' } }],
    ['azel', '서클릿+판금+혈색 망토', { headgear: 'circlet', armor: 'plate', armorColor: '#4a4a58', armorTrim: '#b01830', cape: { color: '#3a0a14', color2: '#b0101e', len: 1.3, style: 'royal' } }],
  ];
  row(EQ.map(([id, label, over]) => ({ label: `${CHARACTERS[id].name.split(' ')[0]} · ${label}`, p: () => { const look = Object.assign(lookOf(id, null, { style: 3, level: 7, rarity: 3 }), over); return ent({ look, ch: CHARACTERS[id] }); } })), 180, 200, 2);
}
if (SEC.includes('npcs') && !ZOOM) {
  header('NPC 의상 (2배)');
  const N = [
    ['마을 주민', { build: 'normal', skin: '#e0b894', hair: '#5a3a2a', hairStyle: 'short', outfit: 'villager', primary: '#6a5a44', secondary: '#3a2a1a', trim: '#8a7a5a', pants: '#3a3028', boots: '#2a1a10' }],
    ['알베르토 신부', { build: 'normal', skin: '#e0c0a0', hair: '#b8b4b0', hairStyle: 'short', outfit: 'priest', primary: '#16121a', secondary: '#6a2a8a', trim: '#e8c872', pants: '#16121a', boots: '#100c10', beard: 'full', height: 0.98 }],
    ['로크(상인)', { build: 'broad', skin: '#d8b090', hair: '#3a2a1a', hairStyle: 'short', outfit: 'merchant', primary: '#4a3a5a', secondary: '#8a6a2a', trim: '#c8a040', pants: '#2a2420', boots: '#2a1a10', headgear: 'wide_hat', headColor: '#3a2a3a', scarf: { color: '#6a2a2a' }, beard: 'stubble' }],
    ['하드윈(대장장이)', { build: 'huge', skin: '#c89070', hair: '#2a1a14', hairStyle: 'bald', outfit: 'smith', primary: '#6a5a4a', secondary: '#4a2a18', trim: '#8a7a6a', pants: '#2a2420', boots: '#1a1410', beard: 'full', height: 1.02 }],
    ['마르타(여관)', { build: 'normal', skin: '#f0d0b8', hair: '#8a3a1a', hairStyle: 'braid', outfit: 'innkeeper', primary: '#5a2a3a', secondary: '#2a1a24', trim: '#e8c872', pants: '#2a1a24', boots: '#1a1014' }],
    ['엘리제(소녀)', { build: 'slim', skin: '#f8e0d0', hair: '#e8c070', hairStyle: 'long', outfit: 'girl', primary: '#4a6aa8', secondary: '#c83a4a', trim: '#f0e8e0', pants: '#f0e8e0', boots: '#3a2418', height: 0.78 }],
    ['카밀라(귀부인)', { build: 'slim', skin: '#f4e8e8', hair: '#1a1018', hairStyle: 'flowing', outfit: 'lady', primary: '#3a0a1a', secondary: '#1a0a10', trim: '#c8a040', pants: '#1a0a10', boots: '#0a0608', eyes: '#ff3040', eyeGlow: true, height: 1.02 }],
  ];
  row(N.map(([label, look]) => ({ label, p: () => ent({ look, ch: { move: {} }, npc: true }) })), 180, 200, 2);
}
if (SEC.includes('rack') && !ZOOM) {
  header('무기 진열대: 단계 1~6 (위: 일반 / 아래: +7·+10·+13 강화, 속성)');
  const TYPES = ['whip', 'sword', 'greatsword', 'dagger', 'gun', 'staff'];
  for (const type of TYPES) {
    const sc = type === 'dagger' || type === 'gun' ? 3.2 : type === 'greatsword' ? 1.9 : type === 'whip' ? 1.6 : 2.2;
    const lvs = [0, 7, 10, 13, 10, 13], els = [null, null, 'fire', null, 'thunder', 'dark'];
    const items = [];
    for (let st = 1; st <= 6; st++) {
      items.push({ label: `${type} ${st}단계`, weapon: { type, style: st, level: 0, rarity: 0 }, sc });
    }
    for (let st = 1; st <= 6; st++) {
      items.push({ label: `${type} ${st}단계 +${lvs[st - 1]}${els[st - 1] ? ' ' + els[st - 1] : ''}`, weapon: { type, style: st, level: lvs[st - 1], rarity: Math.min(5, st - 1), element: els[st - 1] }, sc });
    }
    row(items.map((it) => ({ ...it, rack: true })), 210, type === 'whip' ? 120 : 90, 1);
  }
}
if (SEC.includes('weapons') && !ZOOM) {
  header('무기 단계 1~6 · 강화 발광(+7/+10/+13) · 속성 — 공격 판정 프레임');
  const T = [['kael', 'whip'], ['azel', 'sword'], ['bran', 'greatsword'], ['lia', 'dagger'], ['victor', 'gun'], ['sera', 'staff']];
  for (const [id, type] of T) {
    const ch = CHARACTERS[id];
    const ms = MOVESETS[type];
    const m = type === 'gun' ? ms.ground[0] : ms.ground[0];
    row([1, 2, 3, 4, 5, 6].map((st) => ({
      label: `${type} ${st}단계 +${[0, 3, 7, 10, 12, 13][st - 1]}`,
      wide: true,
      p: () => ent({ look: lookOf(id, null, { style: st, level: [0, 3, 7, 10, 12, 13][st - 1], rarity: st - 1, element: st === 4 ? 'fire' : st === 5 ? 'thunder' : null }), ch, anim: m.anim, move: m, moveT: type === 'gun' ? m.hit[0] + 0.01 : (m.hit[0] + m.hit[1]) / 2, muzzleT: 0.05 }),
    })), 210, 190, 1.6);
  }
}
Y += 20;
cv.width = W; cv.height = Y;
cv.style.width = W + 'px'; cv.style.height = Y + 'px';

function bg() {
  const g = ctx.createLinearGradient(0, 0, 0, Y);
  g.addColorStop(0, '#120a18'); g.addColorStop(0.5, '#1a0c14'); g.addColorStop(1, '#0a0810');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, Y);
  // 어둡고 복잡한 배경 흉내 (가독성 확인)
  let s = 7;
  const rnd = () => ((s = (s * 16807) % 2147483647) / 2147483647);
  for (let i = 0; i < 900; i++) {
    const x = rnd() * W, y = rnd() * Y, r = 4 + rnd() * 40;
    ctx.fillStyle = `rgba(${60 + rnd() * 80},${20 + rnd() * 30},${40 + rnd() * 50},${0.05 + rnd() * 0.08})`;
    ctx.fillRect(x, y, r, r * 0.5);
  }
}
const scratch = document.createElement('canvas'); scratch.width = 900; scratch.height = 900;
const sctx = scratch.getContext('2d');

function drawRack(cell, time) {
  const { x, y, w, h, sc } = cell;
  ctx.save();
  ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
  ctx.fillStyle = 'rgba(0,0,0,0.25)'; ctx.fillRect(x + 2, y + 2, w - 4, h - 4);
  const t = cell.weapon.type;
  const hx = t === 'whip' ? x + 22 : t === 'staff' ? x + 78 : t === 'gun' || t === 'dagger' ? x + 70 : x + 30;
  drawWeaponPreview(ctx, cell.weapon, hx, y + h * 0.45, t === 'whip' ? 0.15 : t === 'gun' ? 0 : -0.22, sc, time);
  ctx.restore();
  ctx.fillStyle = '#c8b89a'; ctx.font = '12px sans-serif'; ctx.fillText(cell.label || '', x + 8, y + h - 8);
}
// 달리기→점프→착지 시뮬레이션 (60fps) — 6프레임마다 한 컷씩 가로로 찍음
function drawStrip(cell) {
  const { x, y, w, h, sc } = cell, id = cell.strip, ch = CHARACTERS[id];
  ctx.save(); ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
  ctx.fillStyle = 'rgba(0,0,0,0.25)'; ctx.fillRect(x + 2, y + 2, w - 4, h - 4);
  const footY = y + h - 22;
  ctx.fillStyle = 'rgba(80,60,70,0.35)'; ctx.fillRect(x + 4, footY, w - 8, 2);
  const e = ent({ look: lookOf(id), ch, anim: 'run', vx: 280 });
  let wx = 0, wy = 0, vy = 0, ground = true, shot = 0, animT = 0, prev = 'run';
  const N = 96;
  for (let f = 0; f < N; f++) {
    const dt = 1 / 60;
    let anim = 'run', vx = 280;
    if (f === 18) { vy = -780; ground = false; }
    if (!ground) { vy += 2200 * dt; wy += vy * dt; if (wy >= 0) { wy = 0; vy = 0; ground = true; e.landT = 0.12; } }
    if (f > 60) vx = Math.max(0, 280 - (f - 60) * 40);
    wx += vx * dt;
    if (!ground) anim = vy < 0 ? 'jump' : 'fall'; else if ((e.landT ?? 0) > 0) { anim = 'land'; e.landT -= dt; } else anim = vx > 30 ? 'run' : 'idle';
    if (anim !== prev) { animT = 0; prev = anim; } else animT += dt;
    Object.assign(e, { anim, animT, vx, vy, onGround: ground, t: 3 + f / 60, facing: 1 });
    e.cx = wx; e.bottom = wy;
    if (f % 6 === 5) {
      ctx.save(); ctx.translate(x + 40 + shot * 78, footY + wy * sc * 0.5); ctx.scale(sc, sc); ctx.translate(-wx, -wy);
      drawHero(ctx, e, null, {}); ctx.restore(); shot++;
    } else {
      sctx.setTransform(sc, 0, 0, sc, 450 - wx * sc, 700);
      drawHero(sctx, e, null, {});
    }
  }
  ctx.restore();
  ctx.fillStyle = '#c8b89a'; ctx.font = '12px sans-serif'; ctx.fillText(cell.label || '', x + 8, y + h - 6);
}
function drawCell(cell, time, live) {
  if (cell.rack) { drawRack(cell, time); return; }
  if (cell.strip) { drawStrip(cell); return; }
  const { x, y, w, h, sc } = cell;
  ctx.save();
  ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
  ctx.fillStyle = 'rgba(0,0,0,0.25)'; ctx.fillRect(x + 2, y + 2, w - 4, h - 4);
  const footX = cell.wide ? x + w * 0.3 : x + w / 2, footY = y + h - 26;
  // 바닥
  ctx.fillStyle = 'rgba(80,60,70,0.35)'; ctx.fillRect(x + 4, footY, w - 8, 2);
  if (!cell.ent) {
    const e = cell.p();
    cell.ent = e;
    // 체인 안정화(워밍업): 이동 중이면 실제로 이동시키며 시뮬
    const vx = e.vx || 0;
    for (let f = 0; f < 50; f++) {
      e.t = 3 + f / 60;
      e.cx = -(vx * (49 - f)) / 60 / sc; e.bottom = 0;
      sctx.setTransform(sc, 0, 0, sc, 450, 700);
      drawHero(sctx, e, null, {});
    }
    e.cx = 0;
  }
  const e = cell.ent;
  if (live) {
    e.t = time; e.animT = (e.anim === 'idle' || e.anim === 'run') ? time : e.animT;
    if (e.move) { e.moveT = (time * 0.6) % e.move.dur; }
  }
  ctx.translate(footX, footY); ctx.scale(sc, sc);
  e.cx = 0; e.bottom = 0;
  drawHero(ctx, e, null, { debugBox: BOX });
  ctx.restore();
  ctx.fillStyle = '#c8b89a'; ctx.font = '12px sans-serif'; ctx.fillText(cell.label || '', x + 8, y + h - 8);
}
function render(time) {
  bg();
  for (const c of cells) {
    if (c.kind === 'h') { ctx.fillStyle = '#e8c872'; ctx.font = 'bold 18px serif'; ctx.fillText(c.text, 12, c.y + 22); continue; }
    drawCell(c, time, LIVE);
  }
}
// 첫 그리기는 조금씩 나눠서(페이지 load 이벤트를 막지 않도록) → 완료 시 window.__ready
async function renderProgressive(time) {
  bg();
  let n = 0;
  for (const c of cells) {
    if (c.kind === 'h') { ctx.fillStyle = '#e8c872'; ctx.font = 'bold 18px serif'; ctx.fillText(c.text, 12, c.y + 22); continue; }
    drawCell(c, time, false);
    if (++n % 6 === 0) await new Promise((r) => setTimeout(r, 0));
  }
}
