<!doctype html>
<html lang="ko">
<head>
<link rel="icon" href="data:,">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>적 갤러리 A</title>
<style>
  html, body { margin: 0; background: #07030a; color: #e8dcc0; font: 12px "Noto Sans KR", sans-serif; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script type="module">
// 적 A 렌더러 갤러리: tools/gallery_enemies_a.html?ids=skeleton,bat&zoom=2&t=1.3&anim=1
//  ids: 표시할 적 (기본: 전체), zoom: 확대, t: 고정 시간, anim=1: 실시간 애니메이션, bg=light: 밝은 배경
import { ENEMIES_A } from '../src/data/enemies_a.js';
import { RENDER_A, PROJ_A } from '../src/render/enemies_a.js';

const q = new URLSearchParams(location.search);
const ids = (q.get('ids') || Object.keys(ENEMIES_A).join(',')).split(',').filter((id) => ENEMIES_A[id]);
const zoom = Number(q.get('zoom') || 1.4);
const fixedT = q.has('t') ? Number(q.get('t')) : 1.37;
const live = q.get('anim') === '1';
const light = q.get('bg') === 'light';

// 적별 표시 프레임: [라벨, {anim, animT, state, stateT, ...}]
const W = (id) => ENEMIES_A[id].aiParams?.windup ?? 0.42;
function frames(id) {
  const d = ENEMIES_A[id];
  const std = [['idle', { anim: 'idle' }], ['walk', { anim: 'walk' }], ['windup', { anim: 'attack', animT: W(id) * 0.85 }], ['swing', { anim: 'attack', animT: W(id) + 0.05 }], ['hit', { anim: 'idle', flashT: 0.1 }]];
  const F = {
    bat: [['hang', { anim: 'hang' }], ['fly', { anim: 'fly' }], ['fly2', { anim: 'fly', t: 1.45 }], ['hit', { anim: 'fly', flashT: 0.1 }]],
    golden_bat: [['fly', { anim: 'fly' }], ['fly2', { anim: 'fly', t: 1.45 }], ['blink', { anim: 'fly', life: 1.2 }]],
    crow: [['perch', { anim: 'perch' }], ['alert', { anim: 'alert', animT: 0.3 }], ['fly', { anim: 'fly' }], ['dive', { anim: 'dive' }]],
    wolf: [['idle', { anim: 'idle' }], ['walk', { anim: 'walk' }], ['wind', { anim: 'wind', animT: 0.3 }], ['charge', { anim: 'charge' }], ['hit', { anim: 'idle', flashT: 0.1 }]],
    zombie: [['rise', { anim: 'rise', animT: 0.4, state: 'rise', stateT: 0.4 }], ['rise2', { anim: 'rise', animT: 0.75, state: 'rise', stateT: 0.75 }], ['walk', { anim: 'walk' }], ['idle', { anim: 'idle' }], ['hit', { anim: 'walk', flashT: 0.1 }]],
    ghost: [['fly', { anim: 'fly' }], ['fly2', { anim: 'fly', t: 2.2 }], ['hit', { anim: 'fly', flashT: 0.1 }]],
    wisp: [['fly', { anim: 'fly' }], ['charge', { anim: 'charge', animT: 0.4 }]],
    gravedigger: [['idle', { anim: 'idle' }], ['walk', { anim: 'walk' }], ['slam↑', { anim: 'slam', animT: 0.55 }], ['slam↓', { anim: 'slam', animT: 0.76 }], ['fling', { anim: 'fling', animT: 0.4 }]],
    mud_man: [['rise', { anim: 'rise', animT: 0.5, state: 'rise', stateT: 0.5 }], ['walk', { anim: 'walk' }], ['punch', { anim: 'punch', animT: 0.4 }], ['throw', { anim: 'throw', animT: 0.45 }], ['under', { anim: 'under', state: 'under' }]],
    armor_knight: std, axe_armor: [['idle', { anim: 'idle' }], ['walk', { anim: 'walk' }], ['high', { anim: 'throw', animT: 0.45, high: true }], ['low', { anim: 'throw', animT: 0.45, high: false }], ['thrown', { anim: 'idle', axeOut: true }]],
    gargoyle: [['statue', { anim: 'statue' }], ['wake', { anim: 'wake', animT: 0.4 }], ['fly', { anim: 'fly' }], ['breath', { anim: 'breath', animT: 0.5 }], ['swoop', { anim: 'swoop' }]],
    medusa_head: [['fly', { anim: 'fly' }], ['fly2', { anim: 'fly', t: 2.1 }], ['hit', { anim: 'fly', flashT: 0.1 }]],
    medusa_spawner: [['(보이지 않음)', { anim: 'idle' }]],
    skeleton_archer: [['idle', { anim: 'idle' }], ['walk', { anim: 'walk' }], ['draw', { anim: 'draw', animT: 0.6, aimA: -0.1 }], ['volley', { anim: 'volley', animT: 0.6, aimA: -0.8 }]],
    blood_skeleton: [['walk', { anim: 'walk' }], ['swing', { anim: 'attack', animT: 0.42 }], ['collapse', { anim: 'collapse', state: 'collapse', stateT: 0.15 }], ['pile', { anim: 'pile', state: 'pile', stateT: 2.8 }], ['reform', { anim: 'reform', state: 'reform', stateT: 0.4 }]],
    phantom_sword: [['fly', { anim: 'fly', swordA: Math.PI / 2 }], ['aim', { anim: 'aim', animT: 0.45, swordA: 0.3 }], ['dash', { anim: 'dash', swordA: 0 }]],
    lesser_demon: [['fly', { anim: 'fly' }], ['cast', { anim: 'cast', animT: 0.5 }], ['swoop', { anim: 'swoop', animT: 0.3 }], ['dive', { anim: 'dive' }]],
    spear_guard: [['idle', { anim: 'idle' }], ['walk', { anim: 'walk' }], ['high', { anim: 'thrust', animT: 0.45, high: true }], ['low', { anim: 'thrust', animT: 0.6, high: false }]],
    puppet_maiden: [['idle', { anim: 'idle' }], ['crouch', { anim: 'crouch' }], ['jump', { anim: 'jump' }], ['throw', { anim: 'throw', animT: 0.35 }]],
    bone_pillar: [['idle', { anim: 'idle' }], ['charge', { anim: 'charge', animT: 0.45 }], ['fire', { anim: 'fire', animT: 0.05 }]],
    corpse_worm: [['idle', { anim: 'idle' }], ['walk', { anim: 'walk' }], ['rear', { anim: 'attack', animT: 0.4 }], ['bite', { anim: 'attack', animT: 0.5 }]],
    bone_scimitar: [['idle', { anim: 'idle' }], ['walk', { anim: 'walk' }], ['ready', { anim: 'combo', animT: 0.2 }], ['cut1', { anim: 'combo', animT: 0.36 }], ['cut2', { anim: 'combo', animT: 0.6 }]],
    book_fiend: [['fly', { anim: 'fly' }], ['fly2', { anim: 'fly', t: 1.6 }], ['cast', { anim: 'cast', animT: 0.4 }], ['bite', { anim: 'bite' }]],
    flea_man: [['idle', { anim: 'idle' }], ['crouch', { anim: 'crouch' }], ['jump', { anim: 'jump' }], ['hit', { anim: 'idle', flashT: 0.1 }]],
    skeleton_mage: [['idle', { anim: 'idle' }], ['walk', { anim: 'walk' }], ['cast', { anim: 'cast', animT: 0.6 }]],
    scholar_ghost: [['float', { anim: 'float' }], ['cast', { anim: 'cast', animT: 0.5 }], ['vanish', { anim: 'vanish', animT: 0.25, alpha: 0.5 }]],
    ectoplasm: [['fly', { anim: 'fly' }], ['squash', { anim: 'squash', animT: 0.2 }], ['lunge', { anim: 'lunge' }], ['small', { anim: 'fly', scale: 0.62 }]],
    mimic: [['closed', { anim: 'closed' }], ['open', { anim: 'open', animT: 0.2 }], ['idle', { anim: 'idle' }], ['jump', { anim: 'jump' }]],
    possessed: std, mummy: std, skeleton_knight: std, skeleton: std,
    bone_thrower: std,
  };
  return F[id] || std;
}

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const COLS = 5, CW = 170 * zoom, CH = 150 * zoom, LABEL = 18;
const rows = ids.length;
cv.width = 150 + COLS * CW; cv.height = rows * (CH + LABEL);
cv.style.width = cv.width + 'px';

function bg() {
  const g = ctx.createLinearGradient(0, 0, 0, cv.height);
  if (light) { g.addColorStop(0, '#6a6070'); g.addColorStop(1, '#3a3040'); }
  else { g.addColorStop(0, '#140a1c'); g.addColorStop(0.5, '#1c0d18'); g.addColorStop(1, '#08040c'); }
  ctx.fillStyle = g; ctx.fillRect(0, 0, cv.width, cv.height);
  // 바쁜 배경 흉내: 벽돌 + 안개
  ctx.globalAlpha = 0.18;
  for (let y = 0; y < cv.height; y += 22) for (let x = (y / 22) % 2 ? 0 : 20; x < cv.width; x += 40) { ctx.strokeStyle = '#6a4a5a'; ctx.strokeRect(x, y, 40, 22); }
  ctx.globalAlpha = 1;
  for (let i = 0; i < 30; i++) {
    const x = (i * 397) % cv.width, y = (i * 173) % cv.height;
    const r = ctx.createRadialGradient(x, y, 0, x, y, 120);
    r.addColorStop(0, i % 3 ? 'rgba(120,30,40,0.18)' : 'rgba(255,140,60,0.12)'); r.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = r; ctx.fillRect(x - 120, y - 120, 240, 240);
  }
}

function makeEnt(id, f, t) {
  const d = ENEMIES_A[id];
  return Object.assign({
    def: d, id, t, anim: 'idle', animT: t % 1, state: f.state ?? f.anim ?? 'idle', stateT: t % 1, flashT: 0, stun: 0, params: { ...(d.aiParams || {}) },
    facing: 1, scale: 1, elite: false, dying: 0, vx: 0, vy: 0, alpha: 1, life: 5,
  }, f, { t: f.t ?? t });
}

function draw(now) {
  const T = live ? now / 1000 : fixedT;
  bg();
  ctx.font = '12px sans-serif';
  ids.forEach((id, r) => {
    const y0 = r * (CH + LABEL);
    ctx.fillStyle = '#e8c872'; ctx.textAlign = 'left';
    ctx.fillText(`${id} — ${ENEMIES_A[id].name}  (${ENEMIES_A[id].size.w}×${ENEMIES_A[id].size.h})`, 8, y0 + 13);
    frames(id).forEach(([label, f], c) => {
      const x = 150 + c * CW + CW / 2, y = y0 + LABEL + CH - 22 * zoom;
      ctx.fillStyle = '#9a8a9a'; ctx.textAlign = 'center'; ctx.fillText(label, x, y0 + LABEL + 12);
      // 바닥선
      ctx.strokeStyle = 'rgba(200,160,120,0.25)'; ctx.beginPath(); ctx.moveTo(x - CW * 0.45, y); ctx.lineTo(x + CW * 0.45, y); ctx.stroke();
      const e = makeEnt(id, f, live ? T + c * 0.13 : (f.t ?? T));
      if (live && f.animT !== undefined) e.animT = f.animT;
      const fn = RENDER_A[ENEMIES_A[id].render];
      ctx.save();
      ctx.translate(x, y); ctx.scale(zoom * (e.scale || 1), zoom * (e.scale || 1));
      ctx.globalAlpha = e.alpha ?? 1;
      try { if (fn) fn(ctx, e, null, { flash: e.flashT > 0 }); else { ctx.fillStyle = '#f0f'; ctx.fillRect(-10, -20, 20, 20); } }
      catch (err) { console.error(id, label, err); ctx.fillStyle = '#f00'; ctx.fillRect(-10, -30, 20, 30); }
      ctx.restore();
    });
  });
  // 투사체 견본
  if (q.get('proj') === '1') {
    let x = 30;
    for (const k of Object.keys(PROJ_A)) {
      const p = { t: T, vx: 300, vy: 0, w: 16, h: 16, rot: T * 5, color: '#ff7a2a', life: 1, maxLife: 2, scale: 1 };
      ctx.save(); ctx.translate(x, cv.height - 40); ctx.scale(zoom, zoom); try { PROJ_A[k](ctx, p, null); } catch (err) { console.error(k, err); } ctx.restore();
      ctx.fillStyle = '#ccc'; ctx.textAlign = 'center'; ctx.fillText(k, x, cv.height - 8);
      x += 90;
    }
  }
  if (live) requestAnimationFrame(draw);
}
requestAnimationFrame(draw);
window.__ready = true;
</script>
</body>
</html>
