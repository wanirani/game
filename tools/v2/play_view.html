const keys = new Set(), pressed = new Set();

addEventListener('keyup', (e) => keys.delete(e.code));
function manualInput() {
  const k = (...c) => c.some((x) => keys.has(x)), p = (...c) => c.some((x) => pressed.has(x));
  const inp = { mx: (k('ArrowRight', 'KeyD') ? 1 : 0) - (k('ArrowLeft', 'KeyA') ? 1 : 0), mz: (k('ArrowUp', 'KeyW') ? 1 : 0) - (k('ArrowDown', 'KeyS') ? 1 : 0), attack: p('KeyJ'), jump: p('KeyK', 'Space'), jumpHeld: k('KeyK', 'Space'), dash: p('KeyL'), guard: k('KeyL'), lockNext: p('KeyO'), attackHeld: k('KeyJ'), skill: p('KeyI'), bell: p('KeyU'), bellHeld: k('KeyU') };

}
let segI = -1;
function demoInput(dt) {

  let t = seqT, i = 0, total = 0; for (const s of d.seq) total += s[0];
  t %= total; while (t >= d.seq[i][0]) { t -= d.seq[i][0]; i++; }
  const seg = d.seq[i], inp = { mx: 0, mz: 0, ...seg[1] };
  if (i !== segI) { segI = i; for (let k = 2; k < seg.length; k++) if (seg[k]) inp[seg[k]] = true; }

}
/** 자동 조종: 'parry' = 적의 판정 직전에 막기를 든다 · 'fight' = 가까운 적에게 가서 치고, 예고가 보이면 구르거나 튕겨낸다 */
const ap = { cd: 0, g: 0, was: false };
function autoPilot(inp, mode) {
  const h = sim.hero; let near = null, nd = 1e9, threat = null;
  for (const e of sim.enemies) { if (e.dead || e.state === 'dead') continue; const d = Math.hypot(e.x - h.x, e.z - h.z); if (d < nd) { nd = d; near = e; } if (e.state === 'attack' && e.atk && !e.atk.shot && d < 260) { const left = e.atk.windup - e.stateT; if (left < 0.15 && left > -0.05) threat = e; } }
  for (const s of sim.shots) if (!s.dead && !s.friendly && Math.hypot(s.x - h.x, s.z - h.z) < 60) threat = threat ?? s;
  ap.cd -= 1 / 60;
  if (mode === 'parry') { inp.guard = !!threat || ap.g > 0; if (threat) ap.g = 0.25; else ap.g -= 1 / 60; return; }
  if (threat && threat.atk && (threat.atk.guard === 'break' || threat.atk.guard === 'chip')) { if (ap.cd <= 0) { const ex = h.x - threat.x, ez = h.z - threat.z, d = Math.hypot(ex, ez) || 1; inp.mx = -ez / d; inp.mz = ex / d; inp.dash = true; ap.cd = 0.8; } return; }
  if (threat) { inp.mx = 0; inp.mz = 0; inp.guard = true; ap.g = 0.2; return; }
  if (ap.g > 0) { ap.g -= 1 / 60; inp.guard = true; inp.mx = inp.mz = 0; return; }
  if (!near) return;
  const ex = near.x - h.x, ez = near.z - h.z;
  if (nd > 120) { inp.mx = ex / nd; inp.mz = ez / nd; }
  else if (ap.cd <= 0) { inp.attack = true; ap.cd = 0.3; }
}

// ── 그리기 ──
const vp = new Float32Array(16), eye = [0, 0, 0], cam = { x: 0, y: 0, z: 0 };
let Wv = 960, Hv = 540;
function camMatrix(C) {

  const px = cam.x - fx * C.dist, py = cam.y + C.lookY - fy * C.dist, pz = cam.z - fz * C.dist;
