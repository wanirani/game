<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>v2 UI view</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../../css/style.css">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #05030a; touch-action: none; }
  #app { position: fixed; inset: 0; }
  #bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  #screen { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
  #live { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: none; }
  #help { position: absolute; left: 50%; bottom: 4px; transform: translateX(-50%); font: 11px sans-serif; color: rgba(255,255,255,.45); pointer-events: none; }
</style>
</head>
<body>
<!--
  v2 interface test page (UI lane). Served by tools/serve.mjs:  /tools/v2/ui_view.html?view=play&bg=bright
    view  play | boss | states | dialog | choice | pause | night | toast | many | kb | padk | empty
    bg    bright | dark | yard | white | black     (captures of index.html?scene=v2c made by tools/v2/ui_backdrop.mjs)
    dev   fold_open | phone2                       (which capture set; default by window shape)
    text  normal | large | xlarge                  (the game's text size setting)
    mode  touch | kb | pad                         (input mode; touch shows the buttons)
    mouse 1                                        (let the mouse press the touch buttons)
    freeze 1                                       (no demo animation: numbers and banners hold still for captures)
    live  v2g                                      (run the real HUD over the live game in an iframe - see ui_view.mjs)
-->
<div id="app">
  <img id="bg" alt="">
  <iframe id="live" title="live game"></iframe>
  <canvas id="screen"></canvas>
  <div id="help"></div>
</div>
<script type="module" src="ui_view.mjs"></script>
</body>
</html>
