<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>uigem 버튼 · 세 가지 배경</title><link rel="icon" href="data:,"><link rel="stylesheet" href="style.css">
<style>
html, body { overflow: auto; height: auto; background: #10121c; touch-action: auto; }
body { font-family: var(--sans); color: var(--iv); padding: 20px 20px 22px; width: 1000px; }
h1 { font: 800 22px var(--serif); letter-spacing: .1em; margin-bottom: 4px; } .sub { font: 500 12.500px var(--sans); color: var(--dim); margin-bottom: 12px; }
.hd, .rw { display: grid; grid-template-columns: 76px 104px repeat(6, 70px) 60px 1fr; align-items: center; justify-items: center; }
.hd { font: 600 11px var(--sans); color: var(--dim); text-align: center; line-height: 1.3; padding-bottom: 6px; }
.rw { position: relative; height: 128px; margin-bottom: 10px; border-radius: 10px; overflow: hidden; background-size: cover; }
.rw > b.t { justify-self: start; padding-left: 8px; font: 700 12px var(--serif); text-shadow: var(--sh); line-height: 1.35; z-index: 2; }
.rw.fire { background-image: url(../../ui_mock/bg/fold_open_yard.webp); background-size: 520%; background-position: 16.500% 66%; }
.rw.stone { background-image: url(../../ui_mock/bg/fold_open_yard.webp); background-size: 300%; background-position: 50% 82%; }
.rw.dark { background-image: url(../../ui_mock/bg/fold_open_street.webp); background-size: 300%; background-position: 30% 14%; }
.rw .abtn, .rw .sbtn { position: relative; right: auto; bottom: auto; flex: none; }
.rw .tx { justify-self: stretch; display: flex; flex-direction: column; gap: 9px; padding: 0 12px 0 16px; align-items: flex-start; }
.rw #hero, .rw #toast, .rw #quest { position: relative; left: auto; right: auto; top: auto; transform: none; }
.rw #hero .pt { width: 46px; height: 46px; } .rw #quest { flex-direction: row; text-align: left; padding: 3px 26px 4px 4px; background: linear-gradient(90deg, rgba(6, 8, 17, .70), rgba(6, 8, 17, .46) 62%, rgba(6, 8, 17, 0)); display: none; }
.rw #toast { height: 32px; }
.hide-ink .ink { visibility: hidden; }
</style></head><body>
<h1>버튼 종류 × 세 가지 배경<small style="font:500 13px var(--sans);color:var(--dim);letter-spacing:0;margin-left:12px">실시간 흐림 없음 — 보이는 그대로가 게임 캔버스에서 나오는 모습</small></h1>
<p class="sub">배경은 시범판의 실제 화면을 크게 당긴 것: 가로등 불빛(가장 밝음) · 마당 돌바닥(중간) · 지붕 그늘(거의 검정).</p>
<div class="hd"><span></span><span>공격<br>(가장 큼)</span><span>기술<br>준비됨</span><span>눌림</span><span>재사용 대기<br>테가 차오름</span><span>잠김</span><span>궁극기<br>다 참</span><span>켜짐<br>(조준)</span><span>시스템</span><span>체력 · 이름 · 알림</span></div>
<div id="rows"></div>
<script type="module">
import './mock.js';
const P = window.__gem.parts();
const cls = (h, c, extra = '') => h.replace('class="abtn ', `class="abtn ${c} `).replace('<button ', `<button ${extra} `);
const size = (h, s) => h.replace('<button ', `<button style="--s:${s}" `);
const row = (id, name) => `<div class="rw ${id}" data-bg="${id}"><b class="t">${name}</b>
  <span data-k="attack">${size(P.acts.attack, 94)}</span><span data-k="ready">${size(P.acts.s1, 58)}</span><span data-k="pressed">${size(cls(P.acts.jump, 'held'), 58)}</span>
  <span data-k="cooldown">${size(cls(P.acts.s2, 'cool'), 58).replace('<b class="ct ink"></b>', '<b class="ct ink">3</b>').replace('style="--s:58"', 'style="--s:58;--cdp:58"')}</span>
  <span data-k="locked">${size(cls(P.acts.mount, 'off'), 48)}</span><span data-k="ult">${size(cls(P.acts.ult, 'full'), 64)}</span><span data-k="on">${size(cls(P.acts.lock, 'on'), 48)}</span>
  <span data-k="system">${P.bag}</span><div class="tx" data-k="text">${P.hero}${P.toast}</div></div>`;
document.getElementById('rows').innerHTML = row('fire', '밝은<br>불빛') + row('stone', '중간<br>돌바닥') + row('dark', '거의<br>검정');
if (new URLSearchParams(location.search).get('hide') === 'ink') document.body.classList.add('hide-ink');
window.__rects = () => [...document.querySelectorAll('.rw [data-k]')].map((e) => { const t = e.dataset.k === 'text' ? e : e.firstElementChild, r = t.getBoundingClientRect(); return { bg: e.closest('.rw').dataset.bg, k: e.dataset.k, x: r.left, y: r.top, w: r.width, h: r.height }; });
Promise.all([document.fonts.ready, ...[...document.images].map((i) => i.decode().catch(() => 0))]).then(() => { window.__ready = true; });
</script></body></html>
