// ── 시범: seq = [[초, 누르고 있는 입력, 눌림 이름…], …]. 자리 · 방향은 dir(여덟 방향)만큼 돌려 놓는다 ──

const DEMOS = {

const rot = (x, z) => { const a = (S.dir * Math.PI) / 4, c = Math.cos(a), s = Math.sin(a); return [x * c - z * s, x * s + z * c]; };

// ── 입력 ──
const keys = new Set(), pressed = new Set();
addEventListener('keydown', (e) => { if (!keys.has(e.code)) pressed.add(e.code); keys.add(e.code); });
addEventListener('keyup', (e) => keys.delete(e.code));
function manualInput() {
  const k = (...c) => c.some((x) => keys.has(x)), p = (...c) => c.some((x) => pressed.has(x));

}

// ── 그리기 ──

// ── 한 틱 ──

  link.update(whip);
}
// 문 당기기: 규칙에 문이 없어 여기서 흉내 낸다 — 던짐 → 감김 → 버팀 → 당김(문이 열린다) → 풀림
function doorPose() {   // 내지르고, 당길 때 몸을 젖힌다 (driveHero 뒤에 자세만 덮어쓴다)
  const t = seqT, A = heroCh.anim;
  if (t >= 0.7 && t < 1.05) { A.play('thrust', { fade: 0.05, time: 0.3 + (t - 0.7) * 2.2 }); A.update(0); }
  else if (t >= 1.5 && t < 2.6) { A.play('guard', { fade: 0.2 }); A.update(1 / 60); }
}
function doorScript(dt) {
  const t = seqT, h = sim.hero, a = door.a + door.open;
  door.hx = door.x + Math.cos(a) * 46 - Math.sin(a) * 7; door.hz = door.z + Math.sin(a) * 46 + Math.cos(a) * 7;
  if (t < 0.7 || t >= 3.3) { driveWhip(whip, h, TUNE, null); return; }
  WRP.x = door.hx; WRP.y = door.hy; WRP.z = door.hz; WRP.r = 4.5; WRP.t = t - 0.7; WRP.throwT = 0.17; WRP.phase = t < 1.5 ? 'throw' : 'pull'; whip.set('wrap', WRP);
  if (t > 1.5) door.open = 1.15 * Math.min(1, (t - 1.5) / 0.9) ** 0.7;
}
function setDemo(id) {
  demo = DEMOS[id] ?? DEMOS.combo; S.demo = DEMOS[id] ? id : 'combo';
  events.length = 0; seqT = 0; segI = -1; time = 0; chars.clear(); pullE = null; pullKeep = 0; local.t = -1;
  const hooks = {
    hit: (e, dmg, mv, x, y, z) => { whip.set('crack', { x, y, z, strength: { L: 0.7, M: 1, H: 1.3, F: 1.6 }[mv.str] ?? 1 }); },
    pull: (e) => { pullE = e; },
    event: (n) => { if (n !== 'step') { events.push(n); if (events.length > 60) events.shift(); } },
  };
  const spawns = demo.spawns.map((s) => { const [x, z] = rot(s.x, s.z); return { ...s, x, z, active: true }; });
  sim = new Sim(flatArena(1400, 1000, spawns), hooks); api.sim = sim;
  const h = sim.hero, [fxx, fzz] = rot(1, 0); h.dirX = fxx; h.dirZ = fzz;
  if (demo.hooks) for (const p of demo.hooks) { const [x, z] = rot(p.x, p.z), to = rot(p.to[0], p.to[1]); sim.hookPoints.push({ ...p, x, z, to }); }
  door.on = !!demo.door; if (door.on) { const [x, z] = rot(215, -40); door.x = x; door.z = z; door.a = (S.dir * Math.PI) / 4 + 2.2; door.open = 0; }   // 문 앞면이 영웅과 카메라 쪽을 비스듬히 본다
  bell.on = !!demo.bell; if (bell.on) { const [x, z] = rot(300, -40); bell.x = x; bell.z = z; bell.swing = 0; }
  heroCh.dx = fxx; heroCh.dz = fzz; heroCh._pm = null; heroCh.anim.play('idle', { fade: 0, restart: true }); heroCh.anim.update(0);
  if (!whip || whip.tier !== S.tier) whip = createWhip({ tier: S.tier, onEvent: (n, e) => { events.push('채찍:' + n + (e.kind ? '/' + e.kind : '')); if (events.length > 60) events.shift(); api.lastEv = n; if (n === 'crack' && bell.on && Math.hypot(e.x - bell.x, e.z - bell.z) < 40) bell.swing = 0.5; link.onEvent(n, e); } });
  api.whip = whip; if (fx) fx.clear(); link.clear();
  heroHand(); whip.reset(hand); whip.set('rest', { style: 'coil' });
  for (let i = 0; i < 40; i++) { whip.update(1 / 60, hand); }
}
function hud() {
  const h = sim.hero, ev = events.slice(-7).join(' · '), st = WR.stats;
  info.textContent = `${demo.name} · 방향 ${S.dir * 45}° · ${ERAS[S.era].name} · t ${time.toFixed(2)} · 카엘 ${h.anim}${h.move ? '(' + h.move.id + ')' : ''} · 채찍 ${whip.mode}${whip.mode === 'swing' ? ' ' + whip.sw.id + ' s ' + whip.sw.s.toFixed(2) : ''} · 끝 속도 ${whip.tip.speed.toFixed(0)} · 펴짐 ${whip.ext.toFixed(2)} · 길이 ${whip.len.toFixed(0)}\n마디 ${whip.n} · 삼각형 ${st.tris} · 그리기 ${st.draws}번 · 버퍼 ${st.bufBytes} B\n${ev}`;
}

// ── 검사 · 캡처용 ──
function seed(n) { let s = n >>> 0; Math.random = () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }
const apply = (o) => { for (const k of ['dir', 'cam', 'era', 'tier', 'slow', 'stop', 'fxOn', 'reso', 'box']) if (o[k] !== undefined) S[k] = o[k]; };
/** 붙임 그림: from 초부터 every 틱마다 count 칸. o: { dir, cam, era, tier, slow, stop, cw, ch, cols, label } → PNG dataURL */
api.strip = (id, o = {}) => {
  apply(o); seed(o.seed ?? 7); setDemo(id);
  const cols = o.cols ?? o.count ?? 10, count = o.count ?? 10, cw = o.cw ?? 240, chh = o.ch ?? 250, rows = Math.ceil(count / cols), dt = (1 / 60) * (S.slow ? 0.25 : 1), every = o.every ?? 2;
  size(cw, chh, 1);
  const sh = document.createElement('canvas'); sh.width = cols * cw; sh.height = rows * chh; const g = sh.getContext('2d'); g.fillStyle = '#000'; g.fillRect(0, 0, sh.width, sh.height);
  const n0 = Math.round((o.from ?? 0) / dt); for (let i = 0; i < n0; i++) step(dt);
  const states = [];
  for (let k = 0; k < count; k++) {
    if (k) for (let i = 0; i < every; i++) step(dt);
    const h = sim.hero; draw(o.label === false ? '' : `${time.toFixed(2)} ${h.move ? h.move.id : h.act ?? h.anim}`);
    g.drawImage(cv, (k % cols) * cw, Math.floor(k / cols) * chh); g.drawImage(ov, (k % cols) * cw, Math.floor(k / cols) * chh);
    states.push(state());

};
/** 한 장: 시범을 t 초까지 돌린 순간. o: { w, h, dpr, … } */
api.shot = (id, t, o = {}) => {
  apply(o); seed(o.seed ?? 7); setDemo(id); size(o.w ?? 480, o.h ?? 400, o.dpr ?? 1);
  const dt = (1 / 60) * (S.slow ? 0.25 : 1), n = Math.round(t / dt); for (let i = 0; i < n; i++) step(dt);
  draw(o.label ?? ''); const c = document.createElement('canvas'); c.width = cv.width; c.height = cv.height; const g = c.getContext('2d'); g.drawImage(cv, 0, 0); g.drawImage(ov, 0, 0);
  return c.toDataURL('image/png');
};
const state = () => { const h = sim.hero; return { t: +time.toFixed(3), anim: h.anim, move: h.move?.id ?? null, act: h.act ?? null, mode: whip.mode, s: whip.mode === 'swing' ? +whip.sw.s.toFixed(2) : null, ext: +whip.ext.toFixed(3), len: +whip.len.toFixed(1), tip: [+whip.tip.x.toFixed(1), +whip.tip.y.toFixed(1), +whip.tip.z.toFixed(1)], speed: +whip.tip.speed.toFixed(0), taut: +whip.taut.toFixed(2), ev: events.slice(-8), stats: { ...WR.stats }, fx: fx ? { ribbons: fx.ribbons.live, particles: fx.particles.drawn ?? 0 } : null }; };
api.state = state;
/** 화면 픽셀로 잰 끈 굵기: 끈의 가운데 마디 근처에서 세로로 훑어 배경이 아닌 픽셀 수 (최소 굵기 검사) */
api.thickness = () => {
  const N = whip.nodes, n = whip.n, i = ((n * 0.7) | 0) * 3, p = project(N[i], N[i + 1], N[i + 2]); if (!p) return null;
  const px = new Uint8Array(4 * 1 * 21), x = Math.round(p[0]), y = Math.round(cv.height - p[1]); gl.readPixels(x, y - 10, 1, 21, gl.RGBA, gl.UNSIGNED_BYTE, px);
  const E = ERAS[S.era].bg; let c = 0; for (let k = 0; k < 21; k++) { const d = Math.abs(px[k * 4] / 255 - E[0]) + Math.abs(px[k * 4 + 1] / 255 - E[1]) + Math.abs(px[k * 4 + 2] / 255 - E[2]); if (d > 0.12) c++; }
  return { at: [x, y], lit: c };
};

async function main() {
  gl = cv.getContext('webgl2', { antialias: q.get('aa') !== '0', alpha: false, preserveDrawingBuffer: true });
  if (!gl) throw new Error('WebGL2 를 쓸 수 없습니다');
  R = new CharRenderer(gl, { maxJoints: 32 });
  WR = new WhipRenderer(gl, {});
  fx = createFx(gl, { tier: 'mid', post: false, feel: false, onEvent: () => {} });
  link = whipFx(fx, null);
  const texCap = Number(q.get('tex') ?? 1024);
  const heroAsset = await loadCharAsset(DIR + 'kael.glb');
  await loadPlayClips(heroAsset);
  heroCh = new Char3D(heroAsset, R, { maxTex: texCap, weapon: false });
  const load = async (m) => { const as = await loadCharAsset(DIR + m + '.glb'); await loadPlayClips(as); as.gpu = R.add(as.model, { maxTex: texCap }); let lo = 1e9, hi = -1e9; for (const p of as.model.prims) for (let i = 1; i < p.pos.length; i += 3) { lo = Math.min(lo, p.pos[i]); hi = Math.max(hi, p.pos[i]); } as.h = hi - lo; return as; };
  dummyAsset = await load(KINDS.skeleton_soldier.model);
  for (const [k, E] of Object.entries(ERAS)) { const tiles = []; for (let i = -14; i < 14; i++) for (let j = -10; j < 10; j++) { const c = (i + j) & 1 ? 1.12 : 0.92; tiles.push({ min: [i * 100, -6, j * 100], max: [i * 100 + 100, 0, j * 100 + 100], color: E.floor.map((v) => v * c) }); } floorGpu[k] = R.add(boxModel(tiles), { mip: false }); }
  blobGpu = R.add(boxModel([{ min: [-1, -0.5, -1], max: [1, 0.5, 1], color: [0, 0, 0] }]), { mip: false });
  { const parts = [{ min: [-3.5, 0, -3.5], max: [3.5, 132, 3.5], color: [0.3, 0.28, 0.27] }, { min: [-6, 0, -6], max: [6, 6, 6], color: [0.24, 0.22, 0.22] }]; for (let i = 0; i < 12; i++) { const a = (i / 12) * 6.2832, x = Math.cos(a) * 15, y = 150 + Math.sin(a) * 15; parts.push({ min: [x - 3.4, y - 3.4, -2], max: [x + 3.4, y + 3.4, 2], color: [1.0, 0.8, 0.32] }); } ringGpu = R.add(boxModel(parts), { mip: false }); }
  doorFrameGpu = R.add(boxModel([{ min: [-6, 0, -7], max: [0, 128, 7], color: [0.26, 0.24, 0.25] }, { min: [58, 0, -7], max: [64, 128, 7], color: [0.26, 0.24, 0.25] }, { min: [-6, 128, -7], max: [64, 138, 7], color: [0.3, 0.28, 0.28] }]), { mip: false });
  doorGpu = R.add(boxModel([{ min: [0, 2, -2.5], max: [58, 126, 2.5], color: [0.36, 0.22, 0.13] }, { min: [4, 20, -3.2], max: [54, 26, 3.2], color: [0.2, 0.19, 0.2] }, { min: [4, 96, -3.2], max: [54, 102, 3.2], color: [0.2, 0.19, 0.2] }, { min: [44, 56, 2.5], max: [48, 68, 7.5], color: [0.8, 0.66, 0.3] }, { min: [41, 58, 5], max: [51, 66, 7.5], color: [0.8, 0.66, 0.3] }]), { mip: false });
  bellGpu = R.add(boxModel([{ min: [-3, 0, -3], max: [3, 178, 3], color: [0.26, 0.22, 0.2] }, { min: [-3, 172, -3], max: [3, 178, 26], color: [0.26, 0.22, 0.2] }, { min: [-1, 150, 19], max: [1, 172, 21], color: [0.5, 0.45, 0.3] }, { min: [-7, 142, 13], max: [7, 152, 27], color: [0.85, 0.66, 0.28] }, { min: [-10, 126, 10], max: [10, 142, 30], color: [0.8, 0.6, 0.24] }, { min: [-12, 120, 8], max: [12, 126, 32], color: [0.9, 0.72, 0.3] }]), { mip: false });
  setDemo(S.demo);
  const btn = (label, fn, on) => { const b = document.createElement('button'); b.textContent = label; b.onclick = () => { fn(); sync(); }; b._on = on; ui.appendChild(b); return b; };
  const sep = (t) => { const s = document.createElement('span'); s.textContent = t; ui.appendChild(s); };
  const sync = () => { for (const b of ui.children) b.classList?.toggle('on', !!b._on?.()); };
  sep('기술'); for (const k of Object.keys(DEMOS)) btn(DEMOS[k].name, () => setDemo(k), () => S.demo === k);
  sep('방향'); ['→', '↘', '↓', '↙', '←', '↖', '↑', '↗'].forEach((n, i) => btn(n, () => { S.dir = i; setDemo(S.demo); }, () => S.dir === i));
  sep('보기'); for (const [k, n] of [['game', '게임 카메라'], ['far', '멀리 (키 70)'], ['close', '가까이'], ['macro', '손잡이 · 종 조각'], ['side', '옆'], ['top', '위']]) btn(n, () => { S.cam = k; }, () => S.cam === k);
  sep('밤'); for (const [k, E] of Object.entries(ERAS)) btn(E.name, () => { S.era = k; }, () => S.era === k);
  sep('품질'); for (const [k, n] of [['low', '낮음'], ['mid', '보통'], ['high', '높음']]) btn(n, () => { S.tier = k; setDemo(S.demo); }, () => S.tier === k);
  sep('시간'); btn('느리게 (1/4)', () => { S.slow = !S.slow; }, () => S.slow); btn('타격 멈춤', () => { S.stop = !S.stop; }, () => S.stop); btn('멈춤', () => { S.pause = !S.pause; }, () => S.pause);
  btn('효과', () => { S.fxOn = !S.fxOn; }, () => S.fxOn); btn('판정 보기', () => { S.box = !S.box; }, () => S.box); btn('울림 가득', () => { S.reso = S.reso > 0.5 ? 0 : 1; }, () => S.reso > 0.5);

main().catch((e) => { api.error = String(e?.stack ?? e?.message ?? e); info.textContent = '열지 못했습니다: ' + api.error; console.error(e); });
