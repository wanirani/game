<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<base href="../../">
<title>퍼펫 QA 검사대</title>
<style>html,body{margin:0;background:#07040a;color:#d8ccb8;font:12px sans-serif}</style>
</head>
<body>
<script type="module">
// 퍼펫 QA 검사대 (tools/puppet/review.mjs 가 구동). 셀 하나 = 영웅 한 자세를 투명 캔버스에 그려
//  ① PNG(dataURL) ② 실루엣 안에 갇힌 투명 구멍(이음매 틈) ③ 반투명 이음선 픽셀 수 ④ 발바닥/머리 위치 를 돌려준다.
// window.__api.render(spec) — spec: {char, cls, wt, mk('g0'|'a1'|'up'|'down'|'crouch'|'dash'|'charge'), t | frac,
//   anim, animT, facing, vx, vy, onGround, sc, W, H, fx, fy, bg, rim, noFx, equip{}, warm, tint, alpha, yaw, vector, world, charging, muzzleT, npc('npc_marta' | true → char 가 NPC id), jointSkip['el2',…]}
//   NPC 는 먼 팔(el2·ua2·fa2)과 치마·수단 속 다리 관절을 검사하지 않는다(오탐). equip.weapon = null 이면 무기 없이 그린다
import { drawHero, setPuppetEnabled, puppetStatus, preloadPuppet, HERO_DRAW_SCALE } from './src/render/hero.js';
import { CHARACTERS } from './src/data/characters.js';
import { CLASSES, classChain } from './src/data/classes.js';
import { MOVESETS } from './src/data/movesets.js';
import { NPCS } from './src/data/npcs.js';
import { TOWN_NPCS } from './src/data/town.js';
import { _debugHost } from './src/render/hero_puppet.js';

// NPC: spec.npc = 'npc_marta' 처럼 NPC id (true 면 spec.char 를 id 로). look 은 데이터 객체 그대로 — 런타임이 객체 동일성으로
// NPC id 를 찾는다(hero_puppet.npcIdOf). NPCS·TOWN_NPCS 에 look 이 없는 NPC(npc_rook2 등, 옛 데이터의 npc_greta)는 NPC_EXTRA·look.npcId 로 지정.
// equip 은 사본에 덮어씀(npcId 유지)
const NPC_EXTRA = { npc_greta: { build: 'normal', height: 0.97, fem: true, outfit: 'villager', skin: '#e8c8a8', hair: '#b8b0a8', hairStyle: 'braid', primary: '#6a4a30', secondary: '#3a2a1a', trim: '#b8322a', pants: '#2a2018', boots: '#3a2418' } };
function npcLook(id, equip) {
  const base = NPCS[id]?.look || TOWN_NPCS?.[id]?.look || null;
  if (base && !equip) return base;
  const look = Object.assign({}, base || (id === 'npc_rook2' ? Object.assign({}, NPCS.npc_rook?.look, { headgear: null }) : NPC_EXTRA[id] || { build: 'normal' }), structuredClone(equip || {}));
  look.npcId = id;
  return look;
}
function lookOf(charId, classId, w = {}, equip = {}) {
  const ch = CHARACTERS[charId];
  const look = structuredClone(ch.look);
  if (classId) for (const c of classChain(classId)) Object.assign(look, structuredClone(c.look || {}));
  look.weapon = { type: w.type ?? ch.weaponType, style: w.style ?? 3, level: w.level ?? 0, rarity: w.rarity ?? 0, element: w.element ?? null };
  return Object.assign(look, structuredClone(equip));
}
function moveOf(wt, mk) {
  const ms = MOVESETS[wt];
  if (!ms || !mk) return null;
  if (/^g\d$/.test(mk)) return ms.ground[+mk[1]] || null;
  if (/^a\d$/.test(mk)) return ms.air[+mk[1]] || null;
  return ms[mk] || null;
}
function moveT(m, frac) {
  const h0 = m.hit[0], h1 = Math.max(m.hit[1], h0 + 0.03);
  // frac: 0~1 예비, 1~2 판정, 2~3 회수
  if (frac < 1) return h0 * frac;
  if (frac < 2) return h0 + (h1 - h0) * (frac - 1);
  return Math.min(m.dur - 0.001, h1 + (m.dur - h1) * (frac - 2));
}
const cv = document.createElement('canvas');
const ctx = cv.getContext('2d', { willReadFrequently: true });
const scratch = document.createElement('canvas'); scratch.width = 800; scratch.height = 800;
const sctx = scratch.getContext('2d');
const FAKE_WORLD = { time: 0 };

function analyse(W, H) {
  const d = ctx.getImageData(0, 0, W, H).data;
  const N = W * H, A = new Uint8Array(N);
  let top = H, bot = -1, left = W, right = -1;
  for (let i = 0; i < N; i++) {
    const a = d[i * 4 + 3]; A[i] = a;
    if (a > 128) { const y = (i / W) | 0, x = i - y * W; if (y < top) top = y; if (y > bot) bot = y; if (x < left) left = x; if (x > right) right = x; }
  }
  // 바깥에서 닿는 픽셀 표시 (thr 미만을 통과)
  const flood = (thr) => {
    const seen = new Uint8Array(N), st = [];
    for (let x = 0; x < W; x++) { st.push(x, (H - 1) * W + x); }
    for (let y = 0; y < H; y++) { st.push(y * W, y * W + W - 1); }
    while (st.length) {
      const i = st.pop();
      if (seen[i] || A[i] >= thr) continue;
      seen[i] = 1;
      const y = (i / W) | 0, x = i - y * W;
      if (x > 0) st.push(i - 1); if (x < W - 1) st.push(i + 1); if (y > 0) st.push(i - W); if (y < H - 1) st.push(i + W);
    }
    return seen;
  };
  // 구멍: 알파 < 96 이면서 바깥과 이어지지 않은 덩어리
  const out = flood(96), lab = new Int32Array(N), holes = [];
  let nl = 0;
  for (let i = 0; i < N; i++) {
    if (A[i] >= 96 || out[i] || lab[i]) continue;
    nl++; let n = 0, sx = 0, sy = 0; const st = [i];
    while (st.length) {
      const j = st.pop();
      if (lab[j] || A[j] >= 96 || out[j]) continue;
      lab[j] = nl; n++;
      const y = (j / W) | 0, x = j - y * W; sx += x; sy += y;
      if (x > 0) st.push(j - 1); if (x < W - 1) st.push(j + 1); if (y > 0) st.push(j - W); if (y < H - 1) st.push(j + W);
    }
    holes.push({ x: Math.round(sx / n), y: Math.round(sy / n), n });
  }
  // 이음선: 바깥과 이어지지 않은 반투명(16~232) 픽셀
  const out2 = flood(233);
  let seam = 0;
  for (let i = 0; i < N; i++) if (A[i] > 16 && A[i] < 233 && !out2[i] && !lab[i]) seam++;
  holes.sort((a, b) => b.n - a.n);
  return { holes: holes.slice(0, 12), holeN: holes.length, holeArea: holes.reduce((s, h) => s + h.n, 0), seam, top, bot, left, right };
}

async function render(s) {
  if (s.vector) setPuppetEnabled(false); else setPuppetEnabled(true);
  const W = s.W || 700, H = s.H || 560, sc = s.sc || 4;
  const fx = s.fx ?? W * 0.42, fy = s.fy ?? H - 50;
  cv.width = W; cv.height = H;
  const npcId = s.npc ? (typeof s.npc === 'string' ? s.npc : s.char) : null;
  const charId = npcId ? null : s.char || 'kael';
  const look = npcId ? npcLook(npcId, s.equip) : lookOf(charId, s.cls, { type: s.wt, style: s.style ?? 3, level: s.level ?? 0, rarity: s.rarity ?? 0, element: s.element ?? null }, s.equip || {});
  const wt = look.weapon?.type ?? null;                       // NPC·equip {weapon:null} 은 무기 없음
  const m = wt ? moveOf(wt, s.mk) : null;
  const air = s.mk ? (s.mk[0] === 'a' || s.mk === 'down') : false;
  const e = { facing: s.facing ?? 1, anim: s.anim || (m ? m.anim : 'idle'), animT: s.animT ?? 0.5, move: m, moveT: m ? (s.t ?? moveT(m, s.frac ?? 1.5)) : 0,
    vx: s.vx ?? 0, vy: s.vy ?? 0, onGround: s.onGround ?? !air, rig: {}, t: 3, stats: { reach: 0 }, charging: s.charging ?? 0.7, muzzleT: s.muzzleT ?? 0.05,
    look, ch: npcId ? { move: { speed: 275 } } : CHARACTERS[charId], hero: s.cls && !npcId ? { classId: s.cls } : undefined, npc: !!npcId, cx: 0, bottom: 0 };
  if (s.ride) e.ride = s.ride;
  if (s.feel) e.feel = s.feel;
  if (s.gaitPh !== undefined) e.gaitPh = s.gaitPh;
  // 준비 대기 (퍼펫 로드)
  for (let k = 0; k < 200; k++) {
    sctx.setTransform(1, 0, 0, 1, 0, 0);
    drawHero(sctx, e, null, {});
    const st = puppetStatus();
    const key = npcId ? 'npc/' + npcId : charId + '/' + (s.cls || '');
    if (s.vector || !st[key] || st[key].state !== 0) break;
    await new Promise((r) => setTimeout(r, 30));
  }
  // 장비 색 변형: 재질 마스크 로드 대기 (첫 프레임은 원래 색일 수 있다)
  if (s.equip || s.waitMs) { for (let k = 0; k < 3; k++) { sctx.setTransform(sc, 0, 0, sc, 400, 600); drawHero(sctx, e, null, {}); await new Promise((r) => setTimeout(r, (s.waitMs ?? 250) / 3)); } }
  // 천 물리 워밍업
  const NW = s.warm ?? 50, vx = e.vx || 0;
  const w0 = s.world ? FAKE_WORLD : null;
  const baseAnimT = e.animT, baseMoveT = e.moveT;
  for (let f = 0; f < NW; f++) {
    e.t = 3 + f / 60; e.cx = -(vx * (NW - 1 - f)) / 60; e.bottom = 0;
    if (s.animate) { e.animT = Math.max(0, baseAnimT - (NW - 1 - f) / 60); if (m) e.moveT = Math.max(0, baseMoveT - (NW - 1 - f) / 60); }
    if (w0) w0.time = e.t;
    sctx.setTransform(sc, 0, 0, sc, 400, 600);
    drawHero(sctx, e, w0, {});
  }
  e.cx = 0; e.bottom = 0;
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, W, H);
  if (s.bg && s.bg !== 'none') { ctx.fillStyle = s.bg; ctx.fillRect(0, 0, W, H); }
  if (s.floor) { ctx.fillStyle = s.floor; ctx.fillRect(0, fy, W, 1); }
  ctx.setTransform(sc, 0, 0, sc, fx, fy);
  const opts = { rim: s.rim ?? false, noFx: s.noFx ?? true };
  if (s.tint) opts.tint = s.tint;
  if (s.alpha !== undefined) opts.alpha = s.alpha;
  if (s.yaw !== undefined) opts.yaw = s.yaw;
  if (s.scale !== undefined) opts.scale = s.scale;
  if (w0) w0.time = e.t;
  const t0 = performance.now();
  drawHero(ctx, e, w0, opts);
  const ms = performance.now() - t0;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  const an = (!s.bg || s.bg === 'none') ? (s.noHoles ? { holes: [], seam: 0 } : analyse(W, H)) : null;
  // 관절 검사: 관절점·뼈 중간점 둘레(반지름 1.4 논리px)의 최소 알파 — 이음매 틈이면 낮다
  let joints = null;
  if (an && e.rig.P && !s.yaw) {
    const Hh = _debugHost(), SK = Hh.SK, P = e.rig.P, O = [0, 0], fac = e.facing < 0 ? -1 : 1, hs = (s.scale ?? 1) * (look.height ?? 1);  // drawHero 의 heroScale 과 같게 (영웅 키 배율 포함: 리아 0.94·브란 1.08)
    const pts = { neck: [SK.nx, SK.ny], sh1: [SK.s1x, SK.s1y], el1: [SK.e1x, SK.e1y], el2: [SK.e2x, SK.e2y], hip1: [SK.hp1x, SK.hp1y], hip2: [SK.hp2x, SK.hp2y],
      kn1: [SK.k1x, SK.k1y], kn2: [SK.k2x, SK.k2y],
      el1b: [SK.e1x, SK.e1y], ua1: [(SK.s1x + SK.e1x) / 2, (SK.s1y + SK.e1y) / 2], fa1: [(SK.e1x + SK.h1x) / 2, (SK.e1y + SK.h1y) / 2], ua2: [(SK.s2x + SK.e2x) / 2, (SK.s2y + SK.e2y) / 2], fa2: [(SK.e2x + SK.h2x) / 2, (SK.e2y + SK.h2y) / 2],
      th1: [(SK.hp1x + SK.k1x) / 2, (SK.hp1y + SK.k1y) / 2], sn1: [(SK.k1x + SK.a1x) / 2, (SK.k1y + SK.a1y) / 2], th2: [(SK.hp2x + SK.k2x) / 2, (SK.hp2y + SK.k2y) / 2], sn2: [(SK.k2x + SK.a2x) / 2, (SK.k2y + SK.a2y) / 2],
      belly: [(SK.px * 2 + SK.nx) / 3, (SK.py * 2 + SK.ny) / 3], chest: [(SK.px + SK.nx * 2) / 3, (SK.py + SK.ny * 2) / 3] };
    // NPC 는 먼 팔이 몸에 가려지고(말하기·손짓), 긴 치마·수단·드레스면 무릎·넓적다리가 옷 속이라 관절 둘레 알파가 원래 낮다 →
    // 그런 점은 검사하지 않는다(heroes3rev §2: 73칸 모두 눈으로 확인한 오탐). 가까운 팔·목·몸통·(바지 차림이면) 다리만 본다.
    // spec.jointSkip: ['el2', …] 로 직접 뺄 수도 있다
    const skip = new Set(s.jointSkip || []);
    if (npcId) {
      for (const k of ['el2', 'ua2', 'fa2']) skip.add(k);
      if (['dress', 'robe', 'long'].includes(look.coat) || ['nun', 'priest', 'lady', 'girl', 'innkeeper'].includes(look.outfit)) for (const k of ['hip1', 'hip2', 'kn1', 'kn2', 'th1', 'th2', 'sn1', 'sn2']) skip.add(k);
    }
    for (const k of skip) delete pts[k];
    const d = ctx.getImageData(0, 0, W, H).data;
    joints = {};
    const r = Math.max(2, Math.round(1.4 * sc * hs));
    const alphaAt = (X, Y) => (X < 0 || Y < 0 || X >= W || Y >= H) ? 255 : d[(Y * W + X) * 4 + 3];
    const scr = (x, y) => { Hh.tx(P, x, y, O); return [fx + fac * hs * sc * O[0], fy + hs * sc * O[1]]; };
    // NPC 뼈 중간점은 원 대신 '뼈를 가로지르는 틈'만 본다: 그레타 손짓처럼 가는 손목(칠해진 폭 < 원 지름)은 원이 팔 바깥 배경을 집어
    // 틈으로 오탐한다. 뼈 방향 ±r 을 따라가며 각 점에서 수직 ±1.5 논리px 안의 최대 알파를 구하고 그 최솟값 — 팔이 끊겨야 낮다
    const BONE = npcId ? { ua1: ['s1', 'e1'], fa1: ['e1', 'h1'], th1: ['hp1', 'k1'], sn1: ['k1', 'a1'], th2: ['hp2', 'k2'], sn2: ['k2', 'a2'] } : {};
    for (const [k, [x, y]] of Object.entries(pts)) {
      const [fcx, fcy] = scr(x, y), cx = Math.round(fcx), cy = Math.round(fcy);
      let mn = 255;
      const b = BONE[k];
      if (b) {
        const [ax, ay] = scr(SK[b[0] + 'x'], SK[b[0] + 'y']), [bx, by] = scr(SK[b[1] + 'x'], SK[b[1] + 'y']);
        const L = Math.hypot(bx - ax, by - ay) || 1, ux = (bx - ax) / L, uy = (by - ay) / L, w = Math.max(2, Math.round(1.5 * sc * hs));
        for (let t = -r; t <= r; t++) {
          let mx = 0;
          for (let q = -w; q <= w && mx < 255; q++) mx = Math.max(mx, alphaAt(Math.round(fcx + ux * t - uy * q), Math.round(fcy + uy * t + ux * q)));
          if (mx < mn) mn = mx;
        }
      } else {
        for (let yy = -r; yy <= r; yy++) for (let xx = -r; xx <= r; xx++) {
          if (xx * xx + yy * yy > r * r) continue;
          const a = alphaAt(cx + xx, cy + yy); if (a < mn) mn = a;
        }
      }
      joints[k] = [cx, cy, mn];
    }
  }
  if (s.label) { ctx.fillStyle = '#fff'; ctx.font = '13px sans-serif'; ctx.fillText(s.label, 6, 16); }
  const url = s.noPng ? null : cv.toDataURL('image/png');
  const P = e.rig.P;
  // 양손 무기(P.two): 먼 손(h2)이 무기 축(h1 에서 P.w1 방향) 위에 있는가 — perp = 축에서 벗어난 거리, along = 축을 따라 손잡이에서 (논리 px). 창(hero7) 먼 주먹 검사
  let grip2 = null;
  if (P && P.two && !s.yaw) { const SK = _debugHost().SK, dx = SK.h2x - SK.h1x, dy = SK.h2y - SK.h1y, c = Math.cos(P.w1), si = Math.sin(P.w1); grip2 = { perp: +Math.abs(dx * si - dy * c).toFixed(2), along: +(dx * c + dy * si).toFixed(2) }; }
  return { url, an, joints, ms, anim: e.anim, moveT: e.moveT, fy, fx, sc, pose: P ? { py: P.py, rot: P.rot, lean: P.lean } : null, grip2 };
}
window.__api = { render, lookOf, moveOf, MOVESETS, CLASSES, CHARACTERS, HERO_DRAW_SCALE, preloadPuppet, puppetStatus };
window.__ready = true;
</script>
</body>
</html>
