<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>보스 갤러리 A</title>
<style>
  html, body { margin: 0; background: #07030a; color: #e8dcc0; font: 12px "Noto Sans KR", sans-serif; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script type="module">
// 보스 A 갤러리: 가짜 월드에서 보스를 실제로 시뮬레이션해 특정 상태/시점을 캡처한다.
//   tools/gallery_bosses_a.html?boss=b_nightwing&cells=idle@0.5,swoop@1.2:1&cols=3&vw=1000&cw=620
//   cells: 상태@시점[:페이즈] (쉼표 구분), vw: 월드 가시 폭, cw: 칸 폭(px), close=1: 보스 확대(배경 없음)
import { BOSSES_A } from '../src/data/bosses_a.js';
import { BOSS_A } from '../src/game/bosses/bosses_a.js';
import { Particles } from '../src/core/particles.js';
import { Projectile } from '../src/game/projectiles.js';
import { getDiff } from '../src/data/difficulty.js';

const q = new URLSearchParams(location.search);
const id = q.get('boss') || 'b_nightwing';
const DEF_CELLS = {
  b_nightwing: 'idle@0.6,idle@0.6:1,idle@0.9:2,swoop@0.6,swoop@1.25,screech@1.3,talon@0.7,talon@1.2,blades@0.5,summon@0.6,bloodRain@1.8:2,transform@0.5:1',
  b_banshee: 'idle@0.6,idle@0.6:1,idle@0.6:2,wail@0.9,wail@1.6,chains@0.5,chains@1.0,hands@1.0,phase@0.5,sweep@0.8,summon@0.7,requiem@1.5:2',
  b_dullahan: 'idle@0.6,idle@0.6:1,idle@0.6:2,charge@0.9,charge@1.6,skull@0.5,skull@1.4,stomp@0.6,stomp@0.95,thrust@0.4,hellfire@0.9:1,transform@0.8:2',
  b_crimson: 'idle@0.6,idle@0.6:1,idle@0.6:2,sweep@0.6,sweep@0.95,overhead@0.7,overhead@1.1,leap@0.5,leap@1.2,thrust@0.5,pillars@0.9,rocket@0.7:2',
  b_bonedragon: 'idle@0.6,idle@0.6:1,idle@1.2:2,bite@0.6,bite@1.0,breath@0.9,breath@1.6,boneRain@1.2,burrow@1.0,burrow@1.8,wall@1.0,spit@0.6',
  b_grimoire: 'idle@0.6,idle@0.6:1,idle@0.6:2,pages@0.9,spell@0.8,spell@1.5,beam@0.8,beam@1.6,slam@0.8,bite@0.5,summon@0.7,idle@0.6:2',
  b_chimera: 'idle@0.6,idle@0.6:1,idle@0.6:2,pounce@0.5,pounce@0.9,goat@0.8,tail@0.5,tail@0.8,acid@0.9,charge@0.7,swipe@0.4,roar@0.8:2',
};
const cells = (q.get('cells') || DEF_CELLS[id] || 'idle@0.6').split(',').map((s) => { const [st, rest] = s.split('@'); const [t, ph] = (rest || '0.6').split(':'); return { st, t: Number(t), ph: Number(ph || 0) }; });
const COLS = Number(q.get('cols') || 3), CW = Number(q.get('cw') || 620), CH = Math.round(CW * (q.get('close') === '1' ? 0.8 : 0.56)), VW = Number(q.get('vw') || 1000);
const close = q.get('close') === '1';
const diffId = q.get('diff') || 'normal';

const TILE = 48, MW = 40, MH = 11, FLOOR = 9 * TILE;
function makeWorld() {
  const map = {
    w: MW, h: MH, pxW: MW * TILE, pxH: MH * TILE,
    typeAt(tx, ty) { if (ty >= MH) return 0; if (tx < 0 || tx >= MW) return 1; return ty >= 9 ? 1 : 0; },
    typeAtPx(x, y) { return this.typeAt(Math.floor(x / TILE), Math.floor(y / TILE)); },
  };
  const w = {
    map, diff: getDiff(diffId), stage: { id: 's01', level: 1 }, state: { difficulty: diffId, progress: { bosses: [], flags: {} }, stats: {} },
    fx: new Particles(1400), camera: { shake() {}, punchZoom() {} }, game: { flash() {}, settings: {}, debug: q.get('debug') === '1', viewW: 1280, viewH: 540 },
    lighting: { add() {} }, entities: [], platforms: [], debrisList: [], time: 0, hitstop: 0, slowmo: 0, timeStop: 0, cutscene: false,
    arena: { x0: 11 * TILE, x1: MW * TILE }, banner: null,
    add(e) { e.world = this; this.entities.push(e); return e; },
    spawnProjectile(o) { return this.add(new Projectile(o)); },
    spawnEnemy(eid, x, y) { return this.add({ kind: 'enemy', fake: eid, x: x - 15, y: y - 30, w: 30, h: 30, cx: x, cy: y - 15, bottom: y, t: 0, dead: false, update(dt) { this.t += dt; }, setState() {}, draw(ctx) { ctx.fillStyle = '#c070ff'; ctx.globalAlpha = 0.7; ctx.fillRect(this.x, this.y, this.w, this.h); ctx.globalAlpha = 1; ctx.fillStyle = '#fff'; ctx.fillText(eid, this.x - 10, this.y - 4); } }); },
    enemies() { return []; }, hittables() { return []; }, nearestEnemy() { return null; },
    onBossDefeated() {}, breakTilesIn() {},
  };
  const px = w.arena.x0 + (w.arena.x1 - w.arena.x0) * 0.36;
  w.player = { x: px - 15, y: FLOOR - 82, w: 30, h: 82, cx: px, cy: FLOOR - 41, bottom: FLOOR, vx: 0, vy: 0, facing: 1, dead: false, onGround: true, stats: {},
    hurtbox() { return { x: -99999, y: -99999, w: 1, h: 1 }; }, takeHit() {} };
  return w;
}

function simulate(cell) {
  const w = makeWorld();
  const C = BOSS_A[id];
  const def = BOSSES_A[id];
  const bx = w.arena.x0 + (w.arena.x1 - w.arena.x0) * 0.72;
  const b = new C(w, def, bx, FLOOR);
  w.add(b); w.boss = b;
  const dt = 1 / 60;
  const step = (n) => {
    for (let i = 0; i < n; i++) {
      w.time += dt;
      for (const e of w.entities.slice()) if (!e.dead) e.update(dt, w);
      w.entities = w.entities.filter((e) => !e.dead);
      w.fx.update(dt, w.map);
      for (const d of w.debrisList) d.update(dt, w.map);
    }
  };
  // 페이즈 적용 (전환 연출 없이)
  if (cell.ph > 0) {
    for (let k = 1; k <= cell.ph; k++) { b.phase = k; b.onPhase?.(k, w); b.phaseApply?.(k, w); }
    b.invuln = false;
  }
  b.setState('idle'); b.cool = 99;
  step(40);
  // 발사체/예고 정리 후 상태 강제
  w.entities = w.entities.filter((e) => e === b || e.kind === 'enemy');
  w.fx.clear();
  if (cell.st !== 'idle') { b.setState(cell.st); if (cell.st === 'transform') b.transformTime = 9; }
  b.cool = 99;
  step(Math.round(cell.t * 60));
  return { w, b };
}

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const rows = Math.ceil(cells.length / COLS);
cv.width = COLS * CW; cv.height = rows * (CH + 18) + 40;
const portrait = new Image();
portrait.src = `../assets/${BOSSES_A[id].portrait}.webp`;

function drawBg(w, vx, vy, s) {
  const g = ctx.createLinearGradient(0, 0, 0, CH);
  g.addColorStop(0, '#120a1e'); g.addColorStop(0.6, '#1e0e1a'); g.addColorStop(1, '#0a0508');
  ctx.fillStyle = g; ctx.fillRect(0, 0, CW, CH);
  // 바쁜 배경 흉내
  ctx.globalAlpha = 0.16;
  for (let y = 0; y < CH; y += 20) for (let x = (y / 20) % 2 ? 0 : 18; x < CW; x += 36) { ctx.strokeStyle = '#8a5a6a'; ctx.strokeRect(x, y, 36, 20); }
  ctx.globalAlpha = 1;
  for (let i = 0; i < 8; i++) {
    const x = (i * 197) % CW, y = (i * 83) % CH;
    const r = ctx.createRadialGradient(x, y, 0, x, y, 120);
    r.addColorStop(0, i % 3 ? 'rgba(140,40,50,0.2)' : 'rgba(255,150,70,0.14)'); r.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = r; ctx.fillRect(x - 120, y - 120, 240, 240);
  }
  // 바닥
  const fy = (FLOOR - vy) * s;
  ctx.fillStyle = '#231a20'; ctx.fillRect(0, fy, CW, CH - fy);
  ctx.fillStyle = '#4a3a3a'; ctx.fillRect(0, fy, CW, 2);
  // 경기장 벽
  for (const ax of [w.arena.x0, w.arena.x1]) { const sx = (ax - vx) * s; ctx.fillStyle = 'rgba(232,200,114,0.25)'; ctx.fillRect(sx - 1, 0, 2, fy); }
}
function drawPlayer(p) {
  ctx.save();
  ctx.translate(p.cx, p.bottom);
  ctx.fillStyle = '#1a1420'; ctx.strokeStyle = '#9fc0ff'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.roundRect(-13, -82, 26, 82, 8); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#e8c2a0'; ctx.beginPath(); ctx.arc(0, -70, 9, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

function render() {
  ctx.fillStyle = '#07030a'; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.fillStyle = '#e8c872'; ctx.font = '600 16px sans-serif';
  const d = BOSSES_A[id];
  ctx.fillText(`${id} — ${d.name} · ${d.title}  (판정 ${d.size.w}×${d.size.h})`, 10, 26);
  cells.forEach((cell, i) => {
    const cx0 = (i % COLS) * CW, cy0 = 40 + Math.floor(i / COLS) * (CH + 18);
    let sim;
    try { sim = simulate(cell); } catch (err) { console.error(cell.st, err); ctx.fillStyle = '#f00'; ctx.fillText('ERR ' + cell.st + ': ' + err.message, cx0 + 8, cy0 + 30); return; }
    const { w, b } = sim;
    ctx.save();
    ctx.translate(cx0, cy0);
    ctx.beginPath(); ctx.rect(0, 0, CW - 4, CH); ctx.clip();
    let s, vx, vy;
    if (close) {
      s = CH / 380; vx = b.cx - CW / 2 / s; vy = b.bottom - CH * 0.9 / s;
      ctx.fillStyle = '#16101c'; ctx.fillRect(0, 0, CW, CH);
      ctx.fillStyle = 'rgba(160,110,90,0.15)'; ctx.fillRect(0, (FLOOR - vy) * s, CW, 2);
    } else {
      s = CW / VW;
      vx = Math.max(w.arena.x0 - 40, Math.min(w.arena.x1 + 40 - VW, (b.cx + w.player.cx) / 2 - VW / 2));
      vy = FLOOR + 50 - CH / s;
      drawBg(w, vx, vy, s);
    }
    ctx.scale(s, s); ctx.translate(-vx, -vy);
    if (!close) drawPlayer(w.player);
    const list = w.entities.filter((e) => !e.dead).sort((a, b2) => (a.z ?? 0) - (b2.z ?? 0));
    w.fx.draw(ctx, 'back');
    for (const d2 of w.debrisList) { ctx.save(); ctx.translate(d2.x + d2.w / 2, d2.y + d2.h / 2); ctx.rotate(d2.rot); d2.draw ? d2.draw(ctx, d2) : (ctx.fillStyle = d2.color, ctx.fillRect(-4, -4, 8, 8)); ctx.restore(); }
    for (const e of list) { try { e.draw(ctx, w); } catch (err) { console.error(cell.st, e.kind, err); } }
    w.fx.draw(ctx, 'front');
    w.fx.draw(ctx, 'top');
    ctx.restore();
    ctx.fillStyle = '#c8b8a8'; ctx.font = '12px sans-serif';
    ctx.fillText(`${cell.st} @${cell.t}s  phase ${cell.ph}  [${b.state}]  ents ${w.entities.length}`, cx0 + 6, cy0 + CH + 13);
  });
  if (q.get('portrait') === '1' && portrait.complete && portrait.naturalWidth) {
    const h = 300, pw = h * portrait.naturalWidth / portrait.naturalHeight;
    ctx.drawImage(portrait, cv.width - pw - 4, 4, pw, h);
  }
  window.__done = true;
}
portrait.onload = render; portrait.onerror = render;
setTimeout(() => { if (!window.__done) render(); }, 1500);
</script>
</body>
</html>
