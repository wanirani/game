<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#07030a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="블러드 녹턴">
<meta name="application-name" content="블러드 녹턴">
<meta name="format-detection" content="telephone=no">
<meta name="color-scheme" content="dark">
<meta name="description" content="블러드 녹턴: 악마성 연대기 — 고딕 호러 아케이드 액션">
<title>블러드 녹턴</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="assets/ui/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="assets/ui/icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/ui/icon-180.png">
<!-- 글꼴은 모두 assets/fonts 에 들어 있다 (오프라인·APK). 모듈보다 먼저 받기 시작한다 (bn-num: 타이틀의 숫자, core/ui.js 가 FontFace 로 등록) -->
<link rel="preload" href="assets/fonts/noto-sans-kr.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/hahmlet.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/grenze-gotisch.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/cinzel.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/cinzel-decorative-900.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/bn-num.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <canvas id="screen" aria-label="게임 화면"></canvas>
  <div id="touch" class="hidden" aria-hidden="true">
    <div id="stick"><div class="ring"></div><div class="knob"></div></div>
    <div id="btns">
      <button class="b big atk" data-act="attack">공격</button>
      <button class="b big jmp" data-act="jump,confirm">점프</button>
      <button class="b dsh" data-act="dash">대시</button>
      <button class="b sub" data-act="sub">보조</button>
      <button class="b sk1" data-act="skill1">S1</button>
      <button class="b sk2" data-act="skill2">S2</button>
      <button class="b ult" data-act="ult">필살</button>
      <button class="b swp" data-act="swap">⇄</button>
    </div>
    <button id="pauseBtn" class="b sys" data-act="menu,cancel">Ⅱ</button>
    <button id="fsBtn" class="b sys" type="button">⛶</button>
  </div>
  <div id="rotate"><div>📱↻<br>가로 모드로 돌려주세요</div></div>
  <div id="boot" role="status" aria-live="polite">
    <div class="t">BLOOD NOCTURNE</div>
    <div class="bar" aria-hidden="true"><i></i></div>
    <div class="s">악마성의 문이 열리고 있습니다… <b class="pct">0%</b></div>
    <noscript><div class="s">자바스크립트를 켜야 플레이할 수 있습니다</div></noscript>
  </div>
</div>
<!-- 인라인 스크립트 없음 (CSP script-src 'self'): 부팅 관문·진행률·오류 화면 → src/boot-gate.js, 전체 화면·서비스 워커 등 → src/core/platform.js -->
<script src="src/boot-gate.js"></script>
<script type="module" src="src/main.js"></script>
</body>
</html>
